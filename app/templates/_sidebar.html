{# Shared admin sidebar. The including page sets: {% set active_page = 'dashboard' %} or 'archive'. #}
<nav class="col-md-2 sidebar d-none d-md-block">
    <div class="sidebar-brand">
        <span class="logo-box"></span>
        BIGTIME EMPIRE
    </div>

    <div class="nav-section">WORKSPACE</div>
    <div class="nav flex-column">
        <a href="/admin" class="{% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/admin/applicants" class="{% if active_page == 'applicants' %}active{% endif %}">Applicants</a>
    </div>

    <div class="nav-section">
        BRANDS <span role="button" data-bs-toggle="modal" data-bs-target="#addBrandModal" aria-label="Add brand">+</span>
    </div>
    <div class="nav flex-column" id="brand-list">
        <span class="px-3 text-muted small fw-bold">Loading...</span>
    </div>

    <div class="nav-section">
        FORMS <span role="button" data-bs-toggle="modal" data-bs-target="#formBuilderModal" aria-label="Add form">+</span>
    </div>
    <div class="nav flex-column" id="form-list">
        <span class="px-3 text-muted small fw-bold">Loading...</span>
    </div>

    <div class="nav flex-column mt-4">
        <a href="/admin/archive" class="{% if active_page == 'archive' %}active{% endif %}">Archive</a>
    </div>
</nav>

{# Add brand modal: Save calls POST /api/v1/admin/brands (handler in admin-sidebar.js). #}
<div class="modal fade" id="addBrandModal" tabindex="-1" aria-labelledby="addBrandModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="addBrandModalLabel">Add brand</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <label for="add-brand-name" class="form-label fw-bold">Brand name</label>
                <input type="text" class="form-control" id="add-brand-name" placeholder="Brand Name">
                <div class="text-danger small mt-2 d-none" id="add-brand-error"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-dark fw-bold" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-dark fw-bold" id="add-brand-save-btn">Save</button>
            </div>
        </div>
    </div>
</div>
