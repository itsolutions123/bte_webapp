<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTE Careers - Set New Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/admin-sidebar.css" rel="stylesheet">
    <style>
        /* Change password page (wired to POST /api/v1/admin/change-password) */
        body.cp-body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .cp-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            box-shadow: var(--soft-shadow);
            padding: 2.5rem 2rem;
        }
        .cp-brand {
            text-align: center;
            margin-bottom: 1.25rem;
        }
        .cp-brand .brand-title {
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--text-main);
        }
        .cp-brand .brand-sub {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .cp-info {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
        }
        .cp-card label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-main);
        }
        .password-wrap {
            position: relative;
        }
        .password-wrap .form-control {
            padding-right: 2.75rem;
        }
        .password-wrap input[type="password"]::-ms-reveal {
            display: none;
        }
        .password-toggle {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: 2.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
        }
        .password-toggle:hover,
        .password-toggle:focus-visible {
            color: var(--text-main);
        }
        .cp-rules-lead {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0 0 0.25rem 0;
        }
        .cp-rules li.rule-ok {
            color: #157347;
        }
        .cp-rules li.rule-bad {
            color: #b02a37;
        }
        .cp-rules {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0 0 1.5rem 0;
            padding-left: 1.1rem;
        }
        .cp-submit-btn {
            background-color: var(--accent-gold);
            border: none;
            color: var(--accent-black);
            font-weight: 700;
        }
        .cp-submit-btn:hover {
            background-color: var(--accent-gold);
            opacity: 0.9;
            color: var(--accent-black);
        }
        .cp-back {
            display: block;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body class="cp-body">
    <div class="cp-card">
        <div class="cp-brand">
            <div class="brand-title">BTE Careers</div>
            <div class="brand-sub">Set a new password</div>
        </div>

        <p class="cp-info">Your temporary password must be replaced before you can sign in.</p>

        <!-- Error message: filled by the script below (server detail or the page's own strings) -->
        <div class="alert alert-danger py-2 px-3 d-none" id="cp-error" role="alert"></div>

        <form id="cp-form" novalidate>
            <div class="mb-3">
                <label for="cp-email" class="form-label">Email</label>
                <input type="email" class="form-control" id="cp-email" name="email" placeholder="name@example.com" autocomplete="username">
            </div>

            <div class="mb-3">
                <label for="cp-temp" class="form-label">Temporary password</label>
                <div class="password-wrap">
                    <input type="password" class="form-control" id="cp-temp" name="temporary_password" placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="password-toggle" data-target="cp-temp" aria-label="Show password" aria-pressed="false">
                        <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="icon-eye-off d-none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label for="cp-new" class="form-label">New password</label>
                <div class="password-wrap">
                    <input type="password" class="form-control" id="cp-new" name="new_password" placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="password-toggle" data-target="cp-new" aria-label="Show password" aria-pressed="false">
                        <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="icon-eye-off d-none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label for="cp-confirm" class="form-label">Confirm new password</label>
                <div class="password-wrap">
                    <input type="password" class="form-control" id="cp-confirm" name="confirm_password" placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="password-toggle" data-target="cp-confirm" aria-label="Show password" aria-pressed="false">
                        <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="icon-eye-off d-none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>
            </div>

            <p class="cp-rules-lead">{{ rules_lead_in }}:</p>
            <ul class="cp-rules" id="cp-rules" data-min-bytes="{{ password_min_bytes }}" data-max-bytes="{{ password_max_bytes }}">
                {% for key, phrase in rule_phrases %}
                <li data-rule="{{ key }}">{{ phrase }}</li>
                {% endfor %}
            </ul>

            <button type="submit" class="btn cp-submit-btn w-100 py-2" id="cp-submit">Set new password</button>
        </form>

        <a class="cp-back" href="/login">Back to sign in</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Show/hide toggles.
        document.querySelectorAll('.password-toggle').forEach(function (btn) {
            btn.addEventListener('click', function () {
                const input = document.getElementById(btn.dataset.target);
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.setAttribute('aria-pressed', show ? 'true' : 'false');
                btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                btn.querySelector('.icon-eye').classList.toggle('d-none', show);
                btn.querySelector('.icon-eye-off').classList.toggle('d-none', !show);
            });
        });

        // Live rule checking: colors each rule li green/red as the user types.
        // Mirrors app/password_rules.py's validate_new_password; the server stays the source of truth.
        const cpRulesList = document.getElementById('cp-rules');
        const minBytes = parseInt(cpRulesList.dataset.minBytes, 10);
        const maxBytes = parseInt(cpRulesList.dataset.maxBytes, 10);
        const SPECIAL_RE = /[^\p{L}\p{N}\s]/u;

        function updateRuleIndicators() {
            const newVal = document.getElementById('cp-new').value;
            const tempVal = document.getElementById('cp-temp').value;
            const results = newVal === '' ? {} : {
                length: (function () {
                    const n = new TextEncoder().encode(newVal).length;
                    return n >= minBytes && n <= maxBytes;
                })(),
                upper: /[A-Z]/.test(newVal),
                lower: /[a-z]/.test(newVal),
                number: /[0-9]/.test(newVal),
                special: SPECIAL_RE.test(newVal),
                different: tempVal === '' ? null : newVal !== tempVal,
            };
            cpRulesList.querySelectorAll('li[data-rule]').forEach(function (li) {
                const result = results[li.dataset.rule];
                li.classList.remove('rule-ok', 'rule-bad');
                if (result === true) { li.classList.add('rule-ok'); }
                else if (result === false) { li.classList.add('rule-bad'); }
            });
        }
        document.getElementById('cp-new').addEventListener('input', updateRuleIndicators);
        document.getElementById('cp-temp').addEventListener('input', updateRuleIndicators);
        ['cp-email', 'cp-temp', 'cp-new', 'cp-confirm'].forEach(function (id) {
            document.getElementById(id).addEventListener('input', function () {
                this.classList.remove('is-invalid');
            });
        });

        // Submit: POST /api/v1/admin/change-password (docs/API_CONTRACT.md, GET /change-password, Submit behavior).
        // The temporary password stays in page memory only: no localStorage, no cookie.
        const MSG_EMPTY = 'Please fill in all fields.';
        const MSG_MISMATCH = 'The new passwords do not match.';
        const MSG_RATE_LIMIT = 'Too many attempts. Please wait a minute and try again.';
        const MSG_FALLBACK = 'Something went wrong. Please try again.';

        const cpError = document.getElementById('cp-error');
        const cpSubmit = document.getElementById('cp-submit');

        function showError(message) {
            cpError.textContent = message;
            cpError.classList.remove('d-none');
        }

        document.getElementById('cp-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            cpError.textContent = '';
            cpError.classList.add('d-none');

            const emailInput = document.getElementById('cp-email');
            const tempInput = document.getElementById('cp-temp');
            const newInput = document.getElementById('cp-new');
            const confirmInput = document.getElementById('cp-confirm');
            [emailInput, tempInput, newInput, confirmInput].forEach(function (input) {
                input.classList.remove('is-invalid');
            });

            const email = emailInput.value.trim();
            const tempValue = tempInput.value;
            const newValue = newInput.value;
            const confirmValue = confirmInput.value;

            const emptyInputs = [];
            if (!email) { emptyInputs.push(emailInput); }
            if (!tempValue) { emptyInputs.push(tempInput); }
            if (!newValue) { emptyInputs.push(newInput); }
            if (!confirmValue) { emptyInputs.push(confirmInput); }
            if (emptyInputs.length > 0) {
                emptyInputs.forEach(function (input) { input.classList.add('is-invalid'); });
                showError(MSG_EMPTY);
                return;
            }
            if (newValue !== confirmValue) {
                newInput.classList.add('is-invalid');
                confirmInput.classList.add('is-invalid');
                showError(MSG_MISMATCH);
                return;
            }

            cpSubmit.disabled = true;
            try {
                const res = await fetch('/api/v1/admin/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, temporary_password: tempValue, new_password: newValue })
                });
                if (res.status === 204) {
                    ['cp-temp', 'cp-new', 'cp-confirm'].forEach(function (id) {
                        document.getElementById(id).value = '';
                    });
                    window.location.href = '/login';
                    return;
                }
                if (res.status === 429) {
                    showError(MSG_RATE_LIMIT);
                } else {
                    let detail = null;
                    try {
                        const data = await res.json();
                        if (typeof data.detail === 'string') { detail = data.detail; }
                    } catch (err) { /* no JSON body: fall through to the fallback */ }
                    showError((res.status === 401 || res.status === 422) && detail ? detail : MSG_FALLBACK);
                }
            } catch (err) {
                showError(MSG_FALLBACK);
            }
            cpSubmit.disabled = false;
        });
    </script>
</body>
</html>
