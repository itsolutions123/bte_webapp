<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRF Portal - Form</title>
    <link href="/static/mrf-portal.css" rel="stylesheet">
</head>
<body class="mrf-app-body">
    <!-- Wizard SHELL (step 5): obviously fake placeholders; step 5a fetches only the form name and assignment (GET /api/v1/mrf/forms/{form_id}). Requires a portal session (require_mrf_page_session). The question panel and the Review panel are shown one at a time. The Review screen lists the real answers (step 5c-2); Submit is inert until step 5e. -->
    <aside class="mrf-side">
        <div class="mrf-brand">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v2H3zM3 6l4.5 4L12 4l4.5 6L21 6l-2 10H5z"/></svg>
            <div>
                <div class="mrf-brand-name">BIGTIME EMPIRE</div>
                <div class="mrf-brand-sub">MRF PORTAL</div>
            </div>
        </div>
        <nav class="mrf-nav" aria-label="Portal">
            <a href="/mrf/requests">My Requests</a>
            <a href="/mrf/forms" class="active" aria-current="page">Forms</a>
        </nav>
        <div class="mrf-user">
            <div class="mrf-avatar" aria-hidden="true">{{ footer_initials }}</div>
            <div class="mrf-user-name">{{ footer_name }}</div>
            <button type="button" class="mrf-icon-btn" aria-label="Log out" title="Not active">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </div>
    </aside>
    <main class="mrf-main">
        <div id="mrf-wizard-message" class="mrf-empty">Loading form...</div>
        <div id="mrf-wizard-body" hidden>
        <div class="mrf-page-head">
            <div>
                <h1 id="mrf-wizard-title">Form Name</h1>
                <p class="mrf-page-sub" id="mrf-wizard-assignment">Assignment (placeholder)</p>
            </div>
        </div>
        <div id="mrf-question-panel" class="mrf-wizard-card">
            <div class="mrf-progress-meta">
                <span id="mrf-progress-text">1 of 0</span>
                <span class="mrf-draft-note">Draft saved (placeholder)</span>
            </div>
            <div class="mrf-progress"><div id="mrf-progress-bar" class="mrf-progress-bar" style="width: 0%"></div></div>
            <div class="mrf-question">
                <p id="mrf-question-text" class="mrf-question-text"></p>
                <p id="mrf-question-hint" class="mrf-question-hint"></p>
                <div id="mrf-options" class="mrf-options"></div>
                <p id="mrf-question-error" class="mrf-error" hidden></p>
            </div>
            <div class="mrf-wizard-nav">
                <button type="button" id="mrf-prev" class="mrf-btn" disabled>Previous</button>
                <button type="button" id="mrf-next" class="mrf-btn mrf-btn-primary">Next</button>
            </div>
        </div>
        <div id="mrf-review-panel" class="mrf-wizard-card" hidden>
            <h2 class="mrf-review-title">Review your answers</h2>
            <p class="mrf-page-sub">Check everything before you submit. A submitted request cannot be edited.</p>
            <div id="mrf-review-list" class="mrf-review-list"></div>
            <div class="mrf-wizard-nav">
                <button type="button" id="mrf-review-back" class="mrf-btn">Back</button>
                <button type="button" class="mrf-btn mrf-btn-primary" disabled>Submit</button>
            </div>
        </div>
        </div>
    </main>
    <script>
        (function () {
            var FORM_URL_PREFIX = "/api/v1/mrf/forms/";
            var LOGIN_PAGE = "/mrf/login";
            var UNAVAILABLE_TEXT = "This form is no longer available";
            var title = document.getElementById("mrf-wizard-title");
            var assignment = document.getElementById("mrf-wizard-assignment");
            var body = document.getElementById("mrf-wizard-body");
            var message = document.getElementById("mrf-wizard-message");

            function showUnavailable() {
                body.hidden = true;
                message.textContent = UNAVAILABLE_TEXT;
                message.hidden = false;
            }

            function formIdFromPath() {
                var parts = window.location.pathname.split("/").filter(function (s) { return s !== ""; });
                return parts[parts.length - 1] || "";
            }

            var ANSWER_MAX_LENGTH = 1000;
            var REQUIRED_TEXT = "Answer every required question.";
            var questionPanel = document.getElementById("mrf-question-panel");
            var reviewPanel = document.getElementById("mrf-review-panel");
            var reviewList = document.getElementById("mrf-review-list");
            var reviewBack = document.getElementById("mrf-review-back");
            var progressText = document.getElementById("mrf-progress-text");
            var progressBar = document.getElementById("mrf-progress-bar");
            var qText = document.getElementById("mrf-question-text");
            var qHint = document.getElementById("mrf-question-hint");
            var qError = document.getElementById("mrf-question-error");
            var optionsBox = document.getElementById("mrf-options");
            var prevBtn = document.getElementById("mrf-prev");
            var nextBtn = document.getElementById("mrf-next");
            var questions = [];
            var answers = {};
            var current = 0;

            function isRequired(q) {
                return q.is_required === true || q.is_classification === true;
            }

            function isBlank(v) {
                return v === undefined || v === null || String(v).trim() === "";
            }

            function optionLabels(q) {
                if (q.question_type === "MULTIPLE_CHOICE") {
                    return (q.options || []).map(function (o) { return o.text; });
                }
                if (q.question_type === "YES_NO") {
                    return q.options || [];
                }
                return [];
            }

            function renderQuestion() {
                var q = questions[current];
                var total = questions.length;
                progressText.textContent = (current + 1) + " of " + total;
                progressBar.style.width = ((current + 1) / total * 100) + "%";
                qText.textContent = q.question_text;
                qHint.textContent = isRequired(q) ? "Required" : "Optional";
                qError.hidden = true;
                optionsBox.textContent = "";
                if (q.question_type === "OPEN_ENDED") {
                    var box = document.createElement("textarea");
                    box.className = "mrf-textbox";
                    box.maxLength = ANSWER_MAX_LENGTH;
                    box.value = answers[q.id] || "";
                    box.addEventListener("input", function () { answers[q.id] = box.value; });
                    optionsBox.appendChild(box);
                } else {
                    optionLabels(q).forEach(function (label) {
                        var opt = document.createElement("div");
                        var dot = document.createElement("span");
                        dot.className = "mrf-option-dot";
                        opt.appendChild(dot);
                        opt.appendChild(document.createTextNode(label));
                        opt.tabIndex = 0;
                        opt.setAttribute("role", "radio");
                        opt.className = "mrf-option" + (answers[q.id] === label ? " selected" : "");
                        opt.setAttribute("aria-checked", answers[q.id] === label ? "true" : "false");
                        function choose() {
                            answers[q.id] = label;
                            qError.hidden = true;
                            Array.prototype.forEach.call(optionsBox.children, function (el) {
                                el.classList.remove("selected");
                                el.setAttribute("aria-checked", "false");
                            });
                            opt.classList.add("selected");
                            opt.setAttribute("aria-checked", "true");
                        }
                        opt.addEventListener("click", choose);
                        opt.addEventListener("keydown", function (ev) {
                            if (ev.key === "Enter" || ev.key === " ") {
                                ev.preventDefault();
                                choose();
                            }
                        });
                        optionsBox.appendChild(opt);
                    });
                }
                prevBtn.disabled = current === 0;
            }

            function renderReview() {
                reviewList.textContent = "";
                questions.forEach(function (q) {
                    var item = document.createElement("div");
                    item.className = "mrf-review-item";
                    var qp = document.createElement("p");
                    qp.className = "mrf-review-q";
                    qp.textContent = q.question_text;
                    var ap = document.createElement("p");
                    ap.className = "mrf-review-a";
                    ap.style.whiteSpace = "pre-wrap";
                    var value = answers[q.id];
                    ap.textContent = isBlank(value) ? "\u2014" : String(value).trim();
                    item.appendChild(qp);
                    item.appendChild(ap);
                    reviewList.appendChild(item);
                });
            }

            function startWizard(list) {
                questions = list;
                answers = {};
                current = 0;
                renderQuestion();
            }

            prevBtn.addEventListener("click", function () {
                if (current > 0) {
                    current -= 1;
                    renderQuestion();
                }
            });

            nextBtn.addEventListener("click", function () {
                var q = questions[current];
                if (isRequired(q) && isBlank(answers[q.id])) {
                    qError.textContent = REQUIRED_TEXT;
                    qError.hidden = false;
                    return;
                }
                if (current < questions.length - 1) {
                    current += 1;
                    renderQuestion();
                } else {
                    renderReview();
                    questionPanel.hidden = true;
                    reviewPanel.hidden = false;
                }
            });

            reviewBack.addEventListener("click", function () {
                reviewPanel.hidden = true;
                questionPanel.hidden = false;
                current = questions.length - 1;
                renderQuestion();
            });

            async function loadForm() {
                var formId = formIdFromPath();
                if (formId === "") {
                    showUnavailable();
                    return;
                }
                try {
                    var response = await fetch(FORM_URL_PREFIX + encodeURIComponent(formId));
                    if (response.status === 401) {
                        window.location.href = LOGIN_PAGE;
                        return;
                    }
                    if (!response.ok) {
                        showUnavailable();
                        return;
                    }
                    var form = await response.json();
                    title.textContent = form.name;
                    assignment.textContent = form.assignment ? form.assignment : "\u2014";
                    if (!Array.isArray(form.questions) || form.questions.length === 0) {
                        showUnavailable();
                        return;
                    }
                    startWizard(form.questions);
                    message.hidden = true;
                    body.hidden = false;
                } catch (err) {
                    showUnavailable();
                }
            }

            loadForm();
        })();
    </script>
</body>
</html>
