<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRF Portal - My Requests</title>
    <link href="/static/mrf-portal.css" rel="stylesheet">
</head>
<body class="mrf-app-body">
    <!-- SHELL (section 8): placeholder content only, except the footer name and avatar, which come from GET /api/v1/mrf/me. No session check. The table is filled from GET /api/v1/mrf/requests (part 78). Search, filter and New Request do nothing yet. The logout icon calls POST /api/v1/mrf/logout. The Forms link opens /mrf/forms. -->
    <aside class="mrf-side">
        <div class="mrf-brand">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v2H3zM3 6l4.5 4L12 4l4.5 6L21 6l-2 10H5z"/></svg>
            <div>
                <div class="mrf-brand-name">BIGTIME EMPIRE</div>
                <div class="mrf-brand-sub">MRF PORTAL</div>
            </div>
        </div>
        <nav class="mrf-nav" aria-label="Portal">
            <a href="/mrf/requests" class="active" aria-current="page">My Requests</a>
            <a href="/mrf/forms">Forms</a>
        </nav>
        <div class="mrf-user">
            <div class="mrf-avatar" aria-hidden="true">{{ footer_initials }}</div>
            <div class="mrf-user-name">{{ footer_name }}</div>
            <button type="button" id="mrf-logout" class="mrf-icon-btn" aria-label="Log out" title="Log out">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </div>
    </aside>
    <main class="mrf-main">
        <div class="mrf-alert" id="mrf-logout-message" role="alert" hidden></div>
        <div class="mrf-page-head">
            <h1>My Requests</h1>
            <button type="button" class="mrf-btn mrf-btn-primary mrf-btn-new">New Request</button>
        </div>
        <div class="mrf-toolbar">
            <input class="mrf-search" type="search" placeholder="Search requests" aria-label="Search requests">
            <select class="mrf-filter" aria-label="Date range">
                <option>Date range</option>
            </select>
        </div>
        <div class="mrf-table-card">
            <table class="mrf-table">
                <thead>
                    <tr>
                        <th>FORM</th>
                        <th>ASSIGNMENT</th>
                        <th>DATE</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody id="mrf-requests-body">
                    <tr>
                        <td colspan="4" class="mrf-empty">Nothing here yet</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
<script>
    (function () {
        var LOGOUT_URL = "/api/v1/mrf/logout";
        var AFTER_LOGOUT_URL = "/mrf/login";
        var FAILED_MESSAGE = "Could not log out. Try again.";

        var button = document.getElementById("mrf-logout");
        var message = document.getElementById("mrf-logout-message");

        var REQUESTS_URL = "/api/v1/mrf/requests?page=1&page_size=50";
        var LOGIN_PAGE = "/mrf/login";
        var EMPTY_TEXT = "Nothing here yet";
        var LOAD_FAILED_TEXT = "Could not load requests. Try again.";
        var REJECTED = "Rejected";

        var tbody = document.getElementById("mrf-requests-body");

        function showRow(text) {
            tbody.textContent = "";
            var tr = document.createElement("tr");
            var td = document.createElement("td");
            td.colSpan = 4;
            td.className = "mrf-empty";
            td.textContent = text;
            tr.appendChild(td);
            tbody.appendChild(tr);
        }

        function formatDate(iso) {
            var d = new Date(iso);
            if (isNaN(d.getTime())) { return ""; }
            return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
        }

        function addCell(tr, text) {
            var td = document.createElement("td");
            td.textContent = text;
            tr.appendChild(td);
            return td;
        }

        function renderRows(rows) {
            tbody.textContent = "";
            rows.forEach(function (item) {
                var tr = document.createElement("tr");
                addCell(tr, item.form_name);
                addCell(tr, item.assignment);
                addCell(tr, formatDate(item.created_at));
                var statusCell = addCell(tr, item.status);
                if (item.status === REJECTED && item.remarks) {
                    var remarks = document.createElement("div");
                    remarks.className = "mrf-request-remarks";
                    remarks.textContent = item.remarks;
                    statusCell.appendChild(remarks);
                }
                tbody.appendChild(tr);
            });
        }

        async function loadRequests() {
            try {
                var response = await fetch(REQUESTS_URL);
                if (response.status === 401) {
                    window.location.replace(LOGIN_PAGE);
                    return;
                }
                if (response.status !== 200) {
                    showRow(LOAD_FAILED_TEXT);
                    return;
                }
                var body = await response.json();
                if (!body.data || body.data.length === 0) {
                    showRow(EMPTY_TEXT);
                    return;
                }
                renderRows(body.data);
            } catch (err) {
                showRow(LOAD_FAILED_TEXT);
            }
        }

        loadRequests();

        button.addEventListener("click", async function () {
            message.hidden = true;
            message.textContent = "";
            button.disabled = true;
            try {
                var response = await fetch(LOGOUT_URL, { method: "POST" });
                if (response.status === 204) {
                    window.location.replace(AFTER_LOGOUT_URL);
                    return;
                }
            } catch (err) {
                // network failure: fall through to the message below
            }
            message.textContent = FAILED_MESSAGE;
            message.hidden = false;
            button.disabled = false;
        });
    })();
    </script>
</body>
</html>
