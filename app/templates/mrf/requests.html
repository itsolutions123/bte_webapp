<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRF Portal - My Requests</title>
    <link href="/static/mrf-portal.css" rel="stylesheet">
</head>
<body class="mrf-app-body">
    <!-- SHELL (section 8): placeholder content only, except the footer name and avatar, which come from GET /api/v1/mrf/me. No session check, no table data. Search, filter and New Request do nothing yet. The logout icon calls POST /api/v1/mrf/logout. The Forms link opens /mrf/forms. -->
    <aside class="mrf-side">
        <div class="mrf-brand">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v2H3zM3 6l4.5 4L12 4l4.5 6L21 6l-2 10H5z"/></svg>
            <div>
                <div class="mrf-brand-name">BIGTIME EMPIRE</div>
                <div class="mrf-brand-sub">MRF PORTAL</div>
            </div>
        </div>
        <nav class="mrf-nav" aria-label="Portal">
            <a href="/mrf/requests" class="active" aria-current="page">My Requests</a>
            <a href="/mrf/forms">Forms</a>
        </nav>
        <div class="mrf-user">
            <div class="mrf-avatar" aria-hidden="true">--</div>
            <div class="mrf-user-name">Signed-in user</div>
            <button type="button" id="mrf-logout" class="mrf-icon-btn" aria-label="Log out" title="Log out">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </div>
    </aside>
    <main class="mrf-main">
        <div class="mrf-alert" id="mrf-logout-message" role="alert" hidden></div>
        <div class="mrf-page-head">
            <h1>My Requests</h1>
            <button type="button" class="mrf-btn mrf-btn-primary mrf-btn-new">New Request</button>
        </div>
        <div class="mrf-toolbar">
            <input class="mrf-search" type="search" placeholder="Search requests" aria-label="Search requests">
            <select class="mrf-filter" aria-label="Date range">
                <option>Date range</option>
            </select>
        </div>
        <div class="mrf-table-card">
            <table class="mrf-table">
                <thead>
                    <tr>
                        <th>JOB POSITION</th>
                        <th>ASSIGNMENT</th>
                        <th>DATE</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="4" class="mrf-empty">Nothing here yet</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
<script>
    (function () {
        var LOGOUT_URL = "/api/v1/mrf/logout";
        var AFTER_LOGOUT_URL = "/mrf/login";
        var FAILED_MESSAGE = "Could not log out. Try again.";
        var ME_URL = "/api/v1/mrf/me";

        var button = document.getElementById("mrf-logout");
        var message = document.getElementById("mrf-logout-message");

        button.addEventListener("click", async function () {
            message.hidden = true;
            message.textContent = "";
            button.disabled = true;
            try {
                var response = await fetch(LOGOUT_URL, { method: "POST" });
                if (response.status === 204) {
                    window.location.replace(AFTER_LOGOUT_URL);
                    return;
                }
            } catch (err) {
                // network failure: fall through to the message below
            }
            message.textContent = FAILED_MESSAGE;
            message.hidden = false;
            button.disabled = false;
        });

        var avatar = document.querySelector(".mrf-user .mrf-avatar");
        var userName = document.querySelector(".mrf-user .mrf-user-name");

        // Fill the footer name and avatar. On any failure the placeholders stay (decided, option A).
        async function loadUser() {
            try {
                var response = await fetch(ME_URL);
                if (!response.ok) { return; }
                var data = await response.json();
                var first = String(data.first_name || "").trim();
                var last = String(data.last_name || "").trim();
                var fullName = (first + " " + last).trim();
                if (fullName === "") { return; }
                userName.textContent = fullName;
                var initials = (first.charAt(0) + last.charAt(0)).toUpperCase();
                if (initials !== "") { avatar.textContent = initials; }
            } catch (err) {
                // network failure: keep the placeholders
            }
        }
        loadUser();
    })();
    </script>
</body>
</html>
