<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRF Portal - Create an account</title>
    <link href="/static/mrf-portal.css" rel="stylesheet">
</head>
<body class="mrf-auth-body">
    <!-- SHELL (section 8): static, no submit wiring. Cancel and the log in link do nothing yet. Dropdown options are static until app/mrf_lists.py exists. -->
    <div class="mrf-brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v2H3zM3 6l4.5 4L12 4l4.5 6L21 6l-2 10H5z"/></svg>
        <div>
            <div class="mrf-brand-name">BIGTIME EMPIRE</div>
            <div class="mrf-brand-sub">MRF PORTAL</div>
        </div>
    </div>
    <div class="mrf-auth-card">
        <h1>Create an account</h1>
        <p class="mrf-lead">Sign up to submit and track your requests.</p>
        <!-- Message area for the later wiring step (validation and result messages). Hidden in the shell. -->
        <div id="mrf-signup-message" class="mrf-alert" hidden></div>
        <form onsubmit="return false" novalidate>
            <div class="mrf-field">
                <label for="mrf-first-name">First name</label>
                <input id="mrf-first-name" type="text" placeholder="First name" autocomplete="given-name">
            </div>
            <div class="mrf-field">
                <label for="mrf-last-name">Last name</label>
                <input id="mrf-last-name" type="text" placeholder="Last name" autocomplete="family-name">
            </div>
            <div class="mrf-field">
                <label for="mrf-email">Email</label>
                <input id="mrf-email" type="email" placeholder="Email address" autocomplete="username">
            </div>
            <div class="mrf-field">
                <label for="mrf-password">Password</label>
                <input id="mrf-password" type="password" placeholder="Password" autocomplete="new-password">
            </div>
            <div class="mrf-field">
                <label for="mrf-department">Department</label>
                <select id="mrf-department">
                    <option value="" selected disabled>Select department</option>
                    <option>Accounting</option>
                    <option>Admin</option>
                    <option>Audit</option>
                    <option>BCC</option>
                    <option>Executive</option>
                    <option>Human Resources</option>
                    <option>Marketing</option>
                    <option>Operations</option>
                    <option>Procurement</option>
                    <option>Project Management</option>
                    <option>Research and Development</option>
                    <option>Sales</option>
                    <option>Repairs and Maintenance</option>
                </select>
            </div>
            <div class="mrf-field">
                <label for="mrf-position">Position</label>
                <select id="mrf-position">
                    <option value="" selected disabled>Select position</option>
                    <option>Head</option>
                    <option>OIC</option>
                    <option>Manager</option>
                </select>
            </div>
            <div class="mrf-actions">
                <button type="button" class="mrf-btn">Cancel</button>
                <button type="button" class="mrf-btn mrf-btn-primary">Create account</button>
            </div>
        </form>
        <p class="mrf-alt">Already have an account? <a href="#">Log in</a></p>
    </div>
    <div class="mrf-foot">Bigtime Empire Corporation &middot; Internal use only</div>
</body>
</html>
