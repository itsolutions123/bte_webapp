<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTE Careers - Brand</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/admin-sidebar.css" rel="stylesheet">
    <style>
        .brand-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            box-shadow: var(--soft-shadow);
            padding: 1.5rem;
        }
        .brand-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .search-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            box-shadow: var(--soft-shadow);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-family: inherit;
            width: 100%;
            max-width: 420px;
        }
        .search-box:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
        .filter-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin: 1rem 0 1.5rem;
        }
        .filter-slot {
            border: 1px solid var(--border-light);
            border-radius: 10px;
            background-color: var(--bg-card);
            color: var(--text-muted);
            padding: 0.4rem 0.9rem;
            min-width: 110px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .job-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            box-shadow: var(--soft-shadow);
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
        }
        .job-card-title {
            font-weight: 800;
            font-size: 1.05rem;
        }
        .job-card-meta {
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            {% include '_sidebar.html' %}
            <main class="col-md-10 px-4 pt-4 pb-5">
                <div class="brand-card">
                    <!-- SHELL (section 8): placeholder content only, nothing here is wired to data yet -->
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <div class="brand-title" id="brand-title">BRAND NAME</div>
                        <button type="button" class="btn btn-sm btn-dark fw-bold" id="create-job-btn">+ Create Job</button>
                    </div>

                    <div class="mt-3">
                        <input type="text" class="search-box" placeholder="Search...">
                    </div>

                    <div class="filter-row">
                        <span class="fw-bold">+ Add filter</span>
                        <span class="filter-slot">&mdash;</span>
                        <span class="filter-slot">&mdash;</span>
                        <span class="filter-slot">&mdash;</span>
                        <span class="filter-slot">&mdash;</span>
                    </div>

                    <div id="job-list">
                        <div class="job-card">
                            <div class="job-card-title">Job Title</div>
                            <div class="job-card-meta">&mdash;</div>
                        </div>
                        <div class="job-card">
                            <div class="job-card-title">Job Title</div>
                            <div class="job-card-meta">&mdash;</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    {% include '_form_builder.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin-sidebar.js"></script>
</body>
</html>
