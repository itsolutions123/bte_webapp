<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTE Careers - Brand</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/admin-sidebar.css" rel="stylesheet">
    <style>
        .brand-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            box-shadow: var(--soft-shadow);
            padding: 1.5rem;
        }
        .brand-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .search-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            box-shadow: var(--soft-shadow);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-family: inherit;
            width: 100%;
            max-width: 420px;
        }
        .search-box:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
        .filter-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin: 1rem 0 1.5rem;
        }
        .filter-slot {
            border: 1px solid var(--border-light);
            border-radius: 10px;
            background-color: var(--bg-card);
            color: var(--text-muted);
            padding: 0.4rem 0.9rem;
            min-width: 110px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .job-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            box-shadow: var(--soft-shadow);
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
        }
        .job-card-title {
            font-weight: 800;
            font-size: 1.05rem;
        }
        .job-card-meta {
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            {% include '_sidebar.html' %}
            <main class="col-md-10 px-4 pt-4 pb-5">
                <div class="brand-card">
                    <!-- SHELL (section 8): placeholder content only, nothing here is wired to data yet -->
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <div class="brand-title" id="brand-title">BRAND NAME</div>
                        <button type="button" class="btn btn-sm btn-dark fw-bold" id="create-job-btn" data-bs-toggle="modal" data-bs-target="#createJobModal">+ Create Job</button>
                    </div>

                    <div class="mt-3">
                        <input type="text" class="search-box" placeholder="Search...">
                    </div>

                    <div class="filter-row">
                        <span class="fw-bold">+ Add filter</span>
                        <span class="filter-slot">&mdash;</span>
                        <span class="filter-slot">&mdash;</span>
                        <span class="filter-slot">&mdash;</span>
                        <span class="filter-slot">&mdash;</span>
                    </div>

                    <div id="job-list">
                        <div class="job-card">
                            <div class="job-card-title">Job Title</div>
                            <div class="job-card-meta">&mdash;</div>
                        </div>
                        <div class="job-card">
                            <div class="job-card-title">Job Title</div>
                            <div class="job-card-meta">&mdash;</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    {# SHELL (section 8): Create Job modal, not wired to data yet. Confirm stays disabled until the create-job step. #}
    <div class="modal fade" id="createJobModal" tabindex="-1" aria-labelledby="createJobModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="createJobModalLabel">Create job</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label for="create-job-title" class="form-label fw-bold">Title</label>
                    <input type="text" class="form-control mb-3" id="create-job-title" placeholder="Job Title">

                    <label for="create-job-description" class="form-label fw-bold">Description</label>
                    <textarea class="form-control mb-3" id="create-job-description" rows="4" placeholder="Description"></textarea>

                    <label for="create-job-requirements" class="form-label fw-bold">Requirements</label>
                    <textarea class="form-control" id="create-job-requirements" rows="4" placeholder="Requirements"></textarea>

                    <div class="text-danger small mt-2 d-none" id="create-job-error"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-dark fw-bold" id="create-job-confirm-btn" disabled>Confirm</button>
                </div>
            </div>
        </div>
    </div>
    {% include '_form_builder.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin-sidebar.js"></script>
    <script>
        // Brand name comes from the sidebar endpoint (same data as the BRANDS list); no per-brand endpoint exists.
        async function fetchBrandName() {
            const brandId = window.location.pathname.split('/').filter(Boolean).pop();
            const titleEl = document.getElementById('brand-title');
            try {
                const res = await fetch('/api/v1/admin/metadata/sidebar');
                if (res.ok) {
                    const data = await res.json();
                    const brand = (data.brands || []).find(function (b) { return b.id === brandId; });
                    titleEl.textContent = brand ? brand.name : 'Brand not found';
                    if (brand) document.title = 'BTE Careers - ' + brand.name;
                } else {
                    titleEl.textContent = 'Unable to load brand name';
                }
            } catch (err) {
                console.error('Failed to load brand name:', err);
                titleEl.textContent = 'Unable to load brand name';
            }
        }
        fetchBrandName();
    </script>
</body>
</html>
