<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTE Careers - Brand</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/admin-sidebar.css" rel="stylesheet">
    <style>
        .brand-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            box-shadow: var(--soft-shadow);
            padding: 1.5rem;
        }
        .brand-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .search-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            box-shadow: var(--soft-shadow);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-family: inherit;
            width: 100%;
            max-width: 420px;
        }
        .search-box:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
        .filter-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin: 1rem 0 1.5rem;
        }
        .filter-slot {
            border: 1px solid var(--border-light);
            border-radius: 10px;
            background-color: var(--bg-card);
            color: var(--text-muted);
            padding: 0.4rem 0.9rem;
            min-width: 110px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .job-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            box-shadow: var(--soft-shadow);
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
        }
        .job-card-title {
            font-weight: 800;
            font-size: 1.05rem;
        }
        .job-card-meta {
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            {% include '_sidebar.html' %}
            <main class="col-md-10 px-4 pt-4 pb-5">
                <div class="brand-card">
                    <!-- SHELL (section 8): placeholder content only, nothing here is wired to data yet -->
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <div class="brand-title" id="brand-title">BRAND NAME</div>
                        <button type="button" class="btn btn-sm btn-dark fw-bold" id="create-job-btn" data-bs-toggle="modal" data-bs-target="#createJobModal">+ Create Job</button>
                    </div>

                    <div class="mt-3">
                        <input type="text" class="search-box" placeholder="Search...">
                    </div>

                    <div class="filter-row">
                        <span class="fw-bold">+ Add filter</span>
                        <span class="filter-slot">&mdash;</span>
                        <span class="filter-slot">&mdash;</span>
                        <span class="filter-slot">&mdash;</span>
                        <span class="filter-slot">&mdash;</span>
                    </div>

                    <div id="job-list"></div>
                    <div class="text-muted d-none" id="job-list-empty">No jobs yet</div>
                    <div class="text-danger small d-none" id="job-list-error"></div>
                </div>
            </main>
        </div>
    </div>
    {# SHELL (section 8): Create Job modal, not wired to data yet. Confirm stays disabled until the create-job step. #}
    <div class="modal fade" id="createJobModal" tabindex="-1" aria-labelledby="createJobModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="createJobModalLabel">Create job</h5>
                    <div class="d-flex align-items-center gap-3 ms-auto">
                        <div class="dropdown">
                            <button type="button" class="btn btn-sm btn-outline-dark fw-bold dropdown-toggle" id="create-job-publish-btn" data-bs-toggle="dropdown" aria-expanded="false">Publish</button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><button type="button" class="dropdown-item" data-publish-state="publish">Publish</button></li>
                                <li><button type="button" class="dropdown-item disabled" aria-disabled="true">Unpublish</button></li>
                                <li><button type="button" class="dropdown-item" data-publish-state="draft">Save as draft</button></li>
                            </ul>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                </div>
                <div class="modal-body">
                    <label for="create-job-title" class="form-label fw-bold">Title</label>
                    <input type="text" class="form-control mb-3" id="create-job-title" placeholder="Job Title">

                    <label for="create-job-description" class="form-label fw-bold">Description</label>
                    <textarea class="form-control mb-3" id="create-job-description" rows="4" placeholder="Description"></textarea>

                    <label for="create-job-requirements" class="form-label fw-bold">Requirements</label>
                    <textarea class="form-control" id="create-job-requirements" rows="4" placeholder="Requirements"></textarea>

                    <div class="text-danger small mt-2 d-none" id="create-job-error"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-dark fw-bold" id="create-job-confirm-btn" disabled>Confirm</button>
                </div>
            </div>
        </div>
    </div>
    {% include '_form_builder.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin-sidebar.js"></script>
    <script>
        // Brand name comes from the sidebar endpoint (same data as the BRANDS list); no per-brand endpoint exists.
        async function fetchBrandName() {
            const brandId = window.location.pathname.split('/').filter(Boolean).pop();
            const titleEl = document.getElementById('brand-title');
            try {
                const res = await fetch('/api/v1/admin/metadata/sidebar');
                if (res.ok) {
                    const data = await res.json();
                    const brand = (data.brands || []).find(function (b) { return b.id === brandId; });
                    titleEl.textContent = brand ? brand.name : 'Brand not found';
                    if (brand) document.title = 'BTE Careers - ' + brand.name;
                } else {
                    titleEl.textContent = 'Unable to load brand name';
                }
            } catch (err) {
                console.error('Failed to load brand name:', err);
                titleEl.textContent = 'Unable to load brand name';
            }
        }
        fetchBrandName();

        // Job cards: rendered from GET /api/v1/admin/brands/{brand_id}/jobs (first page only, API default limit)
        async function loadJobs() {
            const brandId = window.location.pathname.split('/').filter(Boolean).pop();
            const listEl = document.getElementById('job-list');
            const emptyEl = document.getElementById('job-list-empty');
            const errorEl = document.getElementById('job-list-error');
            emptyEl.classList.add('d-none');
            errorEl.classList.add('d-none');
            try {
                const res = await fetch('/api/v1/admin/brands/' + encodeURIComponent(brandId) + '/jobs');
                if (!res.ok) {
                    errorEl.textContent = res.status === 404 ? 'This brand no longer exists.' : 'Unable to load jobs.';
                    errorEl.classList.remove('d-none');
                    return;
                }
                const data = await res.json();
                listEl.replaceChildren();
                (data.data || []).forEach(function (job) {
                    const card = document.createElement('div');
                    card.className = 'job-card';
                    const title = document.createElement('div');
                    title.className = 'job-card-title';
                    title.textContent = job.title;
                    const meta = document.createElement('div');
                    meta.className = 'job-card-meta';
                    meta.textContent = (job.is_active ? 'Published' : 'Not published') + (job.created_at ? ' - ' + job.created_at.slice(0, 10) : '');
                    card.appendChild(title);
                    card.appendChild(meta);
                    listEl.appendChild(card);
                });
                if (!data.total) emptyEl.classList.remove('d-none');
            } catch (err) {
                console.error('Failed to load jobs:', err);
                errorEl.textContent = 'Could not reach the server.';
                errorEl.classList.remove('d-none');
            }
        }
        loadJobs();

        // Create Job: the dropdown only selects the state; Confirm saves via POST /api/v1/admin/brands/{brand_id}/jobs
        (function () {
            const modalEl = document.getElementById('createJobModal');
            if (!modalEl) return;
            const brandId = window.location.pathname.split('/').filter(Boolean).pop();
            const titleInput = document.getElementById('create-job-title');
            const descInput = document.getElementById('create-job-description');
            const reqInput = document.getElementById('create-job-requirements');
            const errorEl = document.getElementById('create-job-error');
            const confirmBtn = document.getElementById('create-job-confirm-btn');
            const publishBtn = document.getElementById('create-job-publish-btn');
            let isActive = true;

            const setState = function (state) {
                isActive = (state === 'publish');
                publishBtn.textContent = isActive ? 'Publish' : 'Save as draft';
            };
            const showError = function (msg) {
                errorEl.textContent = msg;
                errorEl.classList.remove('d-none');
            };

            modalEl.querySelectorAll('[data-publish-state]').forEach(function (item) {
                item.addEventListener('click', function () { setState(item.getAttribute('data-publish-state')); });
            });
            titleInput.addEventListener('input', function () {
                confirmBtn.disabled = !titleInput.value.trim();
            });
            modalEl.addEventListener('show.bs.modal', function () {
                titleInput.value = '';
                descInput.value = '';
                reqInput.value = '';
                errorEl.classList.add('d-none');
                confirmBtn.disabled = true;
                setState('publish');
            });
            modalEl.addEventListener('shown.bs.modal', function () { titleInput.focus(); });

            confirmBtn.addEventListener('click', async function () {
                errorEl.classList.add('d-none');
                const title = titleInput.value.trim();
                if (!title) { showError('Please enter a job title.'); return; }
                confirmBtn.disabled = true;
                try {
                    const res = await fetch('/api/v1/admin/brands/' + encodeURIComponent(brandId) + '/jobs', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title: title,
                            description: descInput.value,
                            requirements: reqInput.value,
                            is_active: isActive
                        })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        bootstrap.Modal.getInstance(modalEl).hide();
                        loadJobs();
                        const toastEl = document.getElementById('form-created-toast');
                        if (toastEl) {
                            document.getElementById('form-created-toast-body').textContent = 'Job "' + data.title + '" created.';
                            new bootstrap.Toast(toastEl).show();
                        }
                        return;
                    }
                    if (res.status === 404) showError('This brand no longer exists.');
                    else if (res.status === 422) showError('Please enter a valid job title.');
                    else showError('Could not create the job. Please try again.');
                } catch (err) {
                    showError('Could not reach the server.');
                } finally {
                    confirmBtn.disabled = !titleInput.value.trim();
                }
            });
        })();
    </script>
</body>
</html>
