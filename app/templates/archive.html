<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTE Careers - Archive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/admin-sidebar.css" rel="stylesheet">
    <style>
        /* Archive cards (SHELL: counts are placeholders, not wired) */
        .archive-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            box-shadow: var(--soft-shadow);
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .archive-card-title { font-weight: 800; font-size: 1.1rem; }
        .archive-card-count { font-weight: 800; font-size: 1.4rem; color: var(--text-muted); }
    </style>
</head>
<body>
    {% set active_page = 'archive' %}
    <div class="container-fluid p-0">
        <div class="row g-0">
            {% include '_sidebar.html' %}

            <main class="col-md-10 px-4 pb-5">
                <h4 class="fw-bold mt-4 mb-4">Archive Assets</h4>
                <div class="d-flex flex-column gap-3">
                    <div class="archive-card">
                        <span class="archive-card-title">Forms</span>
                        <span class="archive-card-count" id="archive-forms-count">&mdash;</span>
                    </div>
                    <div class="archive-card">
                        <span class="archive-card-title">Applicants</span>
                        <span class="archive-card-count" id="archive-applicants-count">&mdash;</span>
                    </div>
                    <div class="archive-card">
                        <span class="archive-card-title">Brands</span>
                        <span class="archive-card-count" id="archive-brands-count">&mdash;</span>
                    </div>
                </div>
            </main>
        </div>
    </div>

    {% include '_form_builder.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin-sidebar.js"></script>
    <script>
        async function loadArchiveCounts() {
            try {
                const res = await fetch('/api/v1/admin/forms?archived=true&limit=1');
                if (!res.ok) return;
                const data = await res.json();
                document.getElementById('archive-forms-count').textContent = data.total;
            } catch (err) {
                console.error('Archive counts load failed:', err);
            }
        }
        document.addEventListener('forms:changed', loadArchiveCounts);
        loadArchiveCounts();
    </script>
</body>
</html>
