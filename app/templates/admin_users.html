<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTE Careers - Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/admin-sidebar.css" rel="stylesheet">
    <style>
        /* Users Directory SHELL (v4 section 8, 2026-11-05): table rows load from GET /api/v1/admin/users (default Users tab); tabs, search, paging, Add users and Archive are still placeholders. */
        .users-header-sub { font-size: 0.9rem; color: var(--text-muted); }
        .users-tabs { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--border-light); margin-bottom: 1rem; }
        .users-tab { font-weight: 700; font-size: 0.95rem; color: var(--text-main); padding-bottom: 0.6rem; border-bottom: 2px solid transparent; margin-bottom: -1px; }
        .users-tab.active { border-bottom-color: var(--text-main); }
        .users-tab { cursor: pointer; }
        .users-toolbar { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
        .users-search { flex: 1; border-radius: 12px; font-size: 0.9rem; }
        .users-add-btn { border-radius: 12px; font-weight: 700; background-color: var(--accent-black); color: #fff; }
        .users-table { font-size: 0.9rem; table-layout: fixed; width: 100%; min-width: 900px; font-variant-numeric: tabular-nums; }
        .users-table th, .users-table td { padding: 0.75rem 0.75rem; vertical-align: middle; white-space: nowrap; }
        .users-table th:nth-child(-n+2), .users-table td:nth-child(-n+2) { overflow: hidden; text-overflow: ellipsis; }
        .users-table th:nth-child(1), .users-table th:nth-child(2) { width: 15%; }
        .users-table th:nth-child(3) { width: 16%; }
        .users-table th:nth-child(4), .users-table th:nth-child(5) { width: 15%; }
        .users-table th:nth-child(6) { width: 14%; }
        .users-table th:nth-child(7) { width: 10%; }
        .users-table th { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; }
        .users-shell-note { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.75rem; }
    </style>
</head>
<body>
    {% set active_page = 'users' %}
    <div class="container-fluid p-0">
        <div class="row g-0">
            {% include '_sidebar.html' %}

            <main class="col-md-10 px-4 pb-5">
                <div class="mt-4 mb-4">
                    <h4 class="fw-bold mb-0">Users Directory</h4>
                    <div class="users-header-sub">Bigtime Empire Corporation</div>
                </div>

                <div class="users-tabs">
                    <span class="users-tab active" data-tab="users">Users</span>
                    <span class="users-tab" data-tab="admins">Admins</span>
                    <span class="users-tab" data-tab="archived">Archived</span>
                </div>

                <div class="users-toolbar">
                    <input type="search" class="form-control users-search" placeholder="Search users" disabled aria-label="Search users">
                    <button type="button" class="btn users-add-btn" disabled>Add users</button>
                </div>

                <div class="table-responsive">
                    <table class="table users-table align-middle">
                        <thead>
                            <tr>
                                <th>First name</th>
                                <th>Last name</th>
                                <th>Role</th>
                                <th>Last login</th>
                                <th>Date added</th>
                                <th>Added by</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-rows"></tbody>
                    </table>
                </div>
                <div class="users-shell-note" id="users-note">Loading...</div>
            </main>
        </div>
    </div>

    {% include '_form_builder.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin-sidebar.js"></script>

    <script>
    (function () {
        const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const rows = document.getElementById('users-rows');
        const note = document.getElementById('users-note');
        const TABS = {
            users: { empty: 'No users yet', noun: 'users' },
            admins: { empty: 'No admins yet', noun: 'admins' },
            archived: { empty: 'No archived users', noun: 'archived users' }
        };
        let currentTab = 'users';
        let requestId = 0;
        const formatDate = function (iso) {
            if (!iso) return '\u2014';
            const month = MONTHS[parseInt(iso.slice(5, 7), 10) - 1];
            if (!month) return '\u2014';
            return month + ' ' + parseInt(iso.slice(8, 10), 10) + ', ' + iso.slice(0, 4);
        };
        const textOrDash = function (value) {
            const s = String(value || '').trim();
            return s || '\u2014';
        };
        const roleLabel = function (role) {
            const s = String(role || '');
            return s ? s.charAt(0) + s.slice(1).toLowerCase() : '\u2014';
        };
        const messageRow = function (text) {
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            td.colSpan = 7;
            td.className = 'text-muted';
            td.textContent = text;
            tr.appendChild(td);
            return tr;
        };
        const addCell = function (tr, text) {
            const td = document.createElement('td');
            td.textContent = text;
            tr.appendChild(td);
            return td;
        };
        const loadUsers = async function (tab) {
            const myRequest = ++requestId;
            rows.textContent = '';
            rows.appendChild(messageRow('Loading...'));
            try {
                const res = await fetch('/api/v1/admin/users?tab=' + encodeURIComponent(tab));
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const body = await res.json();
                if (myRequest !== requestId) return;
                rows.textContent = '';
                if (body.data.length === 0) {
                    rows.appendChild(messageRow(TABS[tab].empty));
                }
                body.data.forEach(function (u) {
                    const tr = document.createElement('tr');
                    tr.dataset.id = u.id;
                    addCell(tr, textOrDash(u.first_name));
                    addCell(tr, textOrDash(u.last_name));
                    addCell(tr, roleLabel(u.role));
                    addCell(tr, formatDate(u.last_login_at));
                    addCell(tr, formatDate(u.created_at));
                    addCell(tr, textOrDash(u.added_by_name));
                    const actions = document.createElement('td');
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'btn btn-outline-dark btn-sm fw-bold';
                    btn.disabled = true;
                    btn.title = 'Not wired yet';
                    btn.textContent = 'Archive';
                    actions.appendChild(btn);
                    tr.appendChild(actions);
                    rows.appendChild(tr);
                });
                note.textContent = 'Showing ' + body.data.length + ' of ' + body.total + ' ' + TABS[tab].noun + '. Search, paging, Add users and Archive are not wired yet.';
            } catch (err) {
                if (myRequest !== requestId) return;
                rows.textContent = '';
                rows.appendChild(messageRow('Could not load users. Please refresh the page.'));
                note.textContent = 'Could not load users.';
            }
        };
        document.querySelectorAll('.users-tab').forEach(function (el) {
            el.addEventListener('click', function () {
                const tab = el.dataset.tab;
                if (!TABS[tab] || tab === currentTab) return;
                currentTab = tab;
                document.querySelectorAll('.users-tab').forEach(function (t) {
                    t.classList.toggle('active', t === el);
                });
                loadUsers(tab);
            });
        });
        loadUsers(currentTab);
    })();
    </script>
</body>
</html>
