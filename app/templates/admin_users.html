<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTE Careers - Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/admin-sidebar.css" rel="stylesheet">
    <style>
        /* Users Directory SHELL (v4 section 8, 2026-11-05): table rows load from GET /api/v1/admin/users (default Users tab); tabs, search, paging, Add users and Archive are still placeholders. */
        .users-header-sub { font-size: 0.9rem; color: var(--text-muted); }
        .users-tabs { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--border-light); margin-bottom: 1rem; }
        .users-tab { font-weight: 700; font-size: 0.95rem; color: var(--text-main); padding-bottom: 0.6rem; border-bottom: 2px solid transparent; margin-bottom: -1px; }
        .users-tab.active { border-bottom-color: var(--text-main); }
        .users-tab { cursor: pointer; }
        .users-toolbar { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
        .users-search { flex: 1; border-radius: 12px; font-size: 0.9rem; }
        .users-add-btn { border-radius: 12px; font-weight: 700; background-color: var(--accent-black); color: #fff; }
        .users-table { font-size: 0.9rem; table-layout: fixed; width: 100%; min-width: 900px; font-variant-numeric: tabular-nums; }
        .users-table th, .users-table td { padding: 0.9rem 0.75rem; vertical-align: middle; white-space: nowrap; }
        .users-table tbody tr:hover > * { --bs-table-bg-state: #f8f9fa; }
        .users-table td.users-muted { color: var(--text-muted); }
        .users-card { background-color: #fff; border: 1px solid var(--border-light); border-radius: 16px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }
        .users-card .users-table { margin-bottom: 0; }
        .users-menu-btn { border: 0; background: transparent; color: var(--text-muted); font-size: 1.1rem; line-height: 1; padding: 0.25rem 0.6rem; border-radius: 8px; }
        .users-menu-btn:hover { background-color: #f8f9fa; color: var(--accent-black); }
        .users-table .dropdown-menu { font-size: 0.85rem; border-radius: 12px; }
        .users-table th:nth-child(-n+2), .users-table td:nth-child(-n+2) { overflow: hidden; text-overflow: ellipsis; }
        .users-table th:nth-child(1), .users-table th:nth-child(2) { width: 15%; }
        .users-table th:nth-child(3) { width: 17%; }
        .users-table th:nth-child(4), .users-table th:nth-child(5) { width: 14%; }
        .users-table th:nth-child(6) { width: 15%; }
        .users-table th:nth-child(7) { width: 10%; }
        .users-table thead th { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; background-color: #fafafa; border-bottom: 1px solid var(--border-light); }
        .users-shell-note { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.75rem; }
        .users-pager { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.75rem; }
        .users-pager .btn { border-radius: 12px; font-weight: 700; }
        .users-page-label { font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>
    {% set active_page = 'users' %}
    <div class="container-fluid p-0">
        <div class="row g-0">
            {% include '_sidebar.html' %}

            <main class="col-md-10 px-4 pb-5">
                <div class="mt-4 mb-4">
                    <h4 class="fw-bold mb-0">Users Directory</h4>
                    <div class="users-header-sub">Bigtime Empire Corporation</div>
                </div>

                <div class="users-tabs">
                    <span class="users-tab active" data-tab="users">Users</span>
                    <span class="users-tab" data-tab="admins">Admins</span>
                    <span class="users-tab" data-tab="archived">Archived</span>
                </div>

                <div class="users-toolbar">
                    <input type="search" class="form-control users-search" id="users-search" name="q" maxlength="100" autocomplete="off" placeholder="Search users" aria-label="Search users">
                    <button type="button" class="btn users-add-btn" disabled>Add users</button>
                </div>

                <div class="table-responsive users-card">
                    <table class="table users-table align-middle">
                        <thead>
                            <tr>
                                <th>First name</th>
                                <th>Last name</th>
                                <th>Role</th>
                                <th>Last login</th>
                                <th>Date added</th>
                                <th>Added by</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-rows"></tbody>
                    </table>
                </div>
                <div class="users-shell-note" id="users-note">Loading...</div>
                <div class="users-pager">
                    <button type="button" class="btn btn-outline-dark btn-sm" id="users-prev" disabled>Previous</button>
                    <span class="users-page-label" id="users-page-label">Page 1 of 1</span>
                    <button type="button" class="btn btn-outline-dark btn-sm" id="users-next" disabled>Next</button>
                </div>
            </main>
        </div>
    </div>

    {% include '_form_builder.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin-sidebar.js"></script>

    <script>
    (function () {
        const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const rows = document.getElementById('users-rows');
        const note = document.getElementById('users-note');
        const TABS = {
            users: { empty: 'No users yet', noun: 'users' },
            admins: { empty: 'No admins yet', noun: 'admins' },
            archived: { empty: 'No archived users', noun: 'archived users' }
        };
        let currentTab = 'users';
        let requestId = 0;
        let currentQuery = '';
        let searchTimer = null;
        const SEARCH_DELAY_MS = 300;
        const PAGE_SIZE = 25;
        // SHELL (2026-11-05): cosmetic only. The real enforcement is the 403 on the future reset-password endpoint.
        const IS_SUPERADMIN = {% if request is defined and request.state.user is defined and request.state.user.role == 'SUPERADMIN' %}true{% else %}false{% endif %};
        let currentPage = 1;
        let totalPages = 1;
        const prevBtn = document.getElementById('users-prev');
        const nextBtn = document.getElementById('users-next');
        const pageLabel = document.getElementById('users-page-label');
        const updatePager = function () {
            pageLabel.textContent = 'Page ' + currentPage + ' of ' + totalPages;
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
        };
        const search = document.getElementById('users-search');
        const formatDate = function (iso) {
            if (!iso) return '\u2014';
            const month = MONTHS[parseInt(iso.slice(5, 7), 10) - 1];
            if (!month) return '\u2014';
            return month + ' ' + parseInt(iso.slice(8, 10), 10) + ', ' + iso.slice(0, 4);
        };
        const textOrDash = function (value) {
            const s = String(value || '').trim();
            return s || '\u2014';
        };
        const roleLabel = function (role) {
            const s = String(role || '');
            return s ? s.charAt(0) + s.slice(1).toLowerCase() : '\u2014';
        };
        const messageRow = function (text) {
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            td.colSpan = 7;
            td.className = 'text-muted';
            td.textContent = text;
            tr.appendChild(td);
            return tr;
        };
        const addCell = function (tr, text) {
            const td = document.createElement('td');
            td.textContent = text;
            tr.appendChild(td);
            return td;
        };
        const loadUsers = async function (tab) {
            const myRequest = ++requestId;
            rows.textContent = '';
            rows.appendChild(messageRow('Loading...'));
            try {
                const q = currentQuery;
                let url = '/api/v1/admin/users?tab=' + encodeURIComponent(tab) + '&page=' + currentPage + '&limit=' + PAGE_SIZE;
                if (q) url += '&q=' + encodeURIComponent(q);
                const res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const body = await res.json();
                if (myRequest !== requestId) return;
                rows.textContent = '';
                if (body.data.length === 0) {
                    rows.appendChild(messageRow(q ? 'No users match your search' : TABS[tab].empty));
                }
                body.data.forEach(function (u) {
                    const tr = document.createElement('tr');
                    tr.dataset.id = u.id;
                    addCell(tr, textOrDash(u.first_name));
                    addCell(tr, textOrDash(u.last_name));
                    const roleTd = addCell(tr, roleLabel(u.role));
                    if (tab !== 'archived' && (u.role === 'MANAGER' || u.role === 'RECRUITER')) {
                        const sel = document.createElement('select');
                        sel.className = 'form-select form-select-sm w-auto';
                        sel.disabled = true;
                        sel.title = 'Not wired yet';
                        sel.setAttribute('aria-label', 'Role');
                        [['MANAGER', 'Manager'], ['RECRUITER', 'Recruiter']].forEach(function (o) {
                            const opt = document.createElement('option');
                            opt.value = o[0];
                            opt.textContent = o[1];
                            sel.appendChild(opt);
                        });
                        sel.value = u.role;
                        roleTd.textContent = '';
                        roleTd.appendChild(sel);
                    }
                    addCell(tr, formatDate(u.last_login_at)).classList.add('users-muted');
                    addCell(tr, formatDate(u.created_at)).classList.add('users-muted');
                    addCell(tr, textOrDash(u.added_by_name)).classList.add('users-muted');
                    const actions = document.createElement('td');
                    if (tab === 'archived') {
                        actions.textContent = '\u2014';
                    } else {
                        const dd = document.createElement('div');
                        dd.className = 'dropdown';
                        const toggle = document.createElement('button');
                        toggle.type = 'button';
                        toggle.className = 'users-menu-btn';
                        toggle.setAttribute('data-bs-toggle', 'dropdown');
                        toggle.setAttribute('aria-expanded', 'false');
                        toggle.setAttribute('aria-label', 'Row actions');
                        toggle.innerHTML = '&#8942;';
                        const menu = document.createElement('ul');
                        menu.className = 'dropdown-menu dropdown-menu-end';
                        const addItem = function (label) {
                            const li = document.createElement('li');
                            const item = document.createElement('button');
                            item.type = 'button';
                            item.className = 'dropdown-item';
                            item.disabled = true;
                            item.title = 'Not wired yet';
                            item.textContent = label;
                            li.appendChild(item);
                            menu.appendChild(li);
                        };
                        if (IS_SUPERADMIN) addItem('Reset password');
                        addItem('Archive');
                        dd.append(toggle, menu);
                        actions.appendChild(dd);
                        new bootstrap.Dropdown(toggle, { popperConfig: { strategy: 'fixed' } });
                    }
                    tr.appendChild(actions);
                    rows.appendChild(tr);
                });
                note.textContent = 'Showing ' + body.data.length + ' of ' + body.total + ' ' + TABS[tab].noun + (q ? ' matching "' + q + '"' : '') + '. Add users, Role, Reset password and Archive are not wired yet.';
                totalPages = Math.max(1, Math.ceil(body.total / body.limit));
                updatePager();
            } catch (err) {
                if (myRequest !== requestId) return;
                rows.textContent = '';
                rows.appendChild(messageRow('Could not load users. Please refresh the page.'));
                note.textContent = 'Could not load users.';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
            }
        };
        document.querySelectorAll('.users-tab').forEach(function (el) {
            el.addEventListener('click', function () {
                const tab = el.dataset.tab;
                if (!TABS[tab] || tab === currentTab) return;
                currentTab = tab;
                currentPage = 1;
                document.querySelectorAll('.users-tab').forEach(function (t) {
                    t.classList.toggle('active', t === el);
                });
                loadUsers(tab);
            });
        });
        prevBtn.addEventListener('click', function () {
            if (currentPage <= 1) return;
            currentPage -= 1;
            loadUsers(currentTab);
        });
        nextBtn.addEventListener('click', function () {
            if (currentPage >= totalPages) return;
            currentPage += 1;
            loadUsers(currentTab);
        });
        search.addEventListener('input', function () {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(function () {
                const q = search.value.trim();
                if (q === currentQuery) return;
                currentQuery = q;
                currentPage = 1;
                loadUsers(currentTab);
            }, SEARCH_DELAY_MS);
        });
        loadUsers(currentTab);
    })();
    </script>
</body>
</html>
