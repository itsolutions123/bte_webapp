<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTE Careers - Candidates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/admin-sidebar.css" rel="stylesheet">
    <style>
        /* Applicants list (2026-10-20 reference layout): cards wired to GET /api/v1/admin/applications; stat cards, search, filters and sort are placeholders */
        .applicants-card { padding: 0; }
        .applicants-header-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-black);
            background-color: var(--accent-gold);
        }
        .applicants-header-sub { font-size: 0.9rem; color: var(--text-muted); }
        .applicants-tabs { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--border-light); margin-bottom: 1rem; }
        .applicants-tab { font-weight: 700; font-size: 0.95rem; color: var(--text-main); padding-bottom: 0.6rem; border-bottom: 2px solid transparent; margin-bottom: -1px; }
        .applicants-tab.active { border-bottom-color: var(--text-main); }
        .applicants-tab-count { color: var(--text-muted); font-weight: 600; font-size: 0.8rem; }
        .applicants-toolbar { display: flex; gap: 0.75rem; margin-bottom: 0.5rem; }
        .applicants-search { flex: 1; border-radius: 12px; font-size: 0.9rem; }
        .applicants-filters-btn { border: 1px solid var(--border-light); border-radius: 12px; font-weight: 700; background-color: var(--bg-card); color: var(--text-main); }
        .applicants-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }
        .applicants-count { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }
        .applicant-list { display: flex; flex-direction: column; }
        .applicant-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            text-align: left;
            background-color: transparent;
            border: 0;
            border-bottom: 1px solid var(--border-light);
            border-radius: 0;
            padding: 1rem 0.5rem;
            color: var(--text-main);
        }
        .applicant-card:hover { background-color: rgba(0, 0, 0, 0.03); }
        .applicant-avatar {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--accent-black);
            background-color: rgba(212, 175, 55, 0.18);
        }
        .applicant-who { flex: 1 1 0; min-width: 0; }
        .applicant-card-name { font-weight: 800; }
        .applicant-card-job { font-size: 0.85rem; color: var(--text-muted); }
        .applicant-cell { font-size: 0.85rem; color: var(--text-muted); }
        .applicant-cell-brand { flex: 0 0 130px; }
        .applicant-cell-date { flex: 0 0 140px; }
        .applicant-cell-score { flex: 0 0 70px; }
        .applicant-status {
            flex: 0 0 100px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent-gold);
            background-color: rgba(212, 175, 55, 0.12);
            border-radius: 999px;
            padding: 0.2rem 0.7rem;
        }
        .applicant-status[data-status="NEW"]      { color: #1d4ed8; background-color: rgba(37, 99, 235, 0.12); }
        .applicant-status[data-status="POOLING"]  { color: #a16207; background-color: rgba(234, 179, 8, 0.20); }
        .applicant-status[data-status="ENDORSED"] { color: #c2410c; background-color: rgba(249, 115, 22, 0.14); }
        .applicant-status[data-status="HIRED"]    { color: #15803d; background-color: rgba(22, 163, 74, 0.14); }
        .applicant-status[data-status="FAILED"]   { color: #b42318; background-color: rgba(180, 35, 24, 0.12); }

        /* Slide-over panel, copied from the Applicants page. On this page the stepper shows the 7 candidate stages
           and each click calls PATCH /api/v1/admin/candidates/{id} (docs/API_CONTRACT.md). */
        .applicant-panel-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1040;
        }
        .applicant-panel-backdrop.is-open { opacity: 1; pointer-events: auto; }
        .applicant-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(640px, 100vw);
            background-color: var(--bg-card);
            box-shadow: -8px 0 24px rgba(0, 0, 0, 0.12);
            transform: translateX(100%);
            transition: transform 0.25s ease;
            z-index: 1050;
            display: flex;
            flex-direction: column;
        }
        .applicant-panel.is-open { transform: translateX(0); }
        .detail-header {
            background-color: var(--bg-main);
            padding: 1.25rem 2rem 1rem;
            border-bottom: 1px solid var(--border-light);
            flex: 0 0 auto;
        }
        .detail-avatar {
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            color: var(--accent-black);
            background-color: rgba(212, 175, 55, 0.18);
        }
        .detail-name { font-weight: 800; font-size: 1.15rem; }
        .detail-subline { font-size: 0.9rem; color: var(--text-muted); margin-top: 0.15rem; }
        .detail-close {
            border: 0;
            background: transparent;
            color: var(--text-muted);
            font-size: 1.25rem;
            line-height: 1;
            padding: 0.25rem;
        }
        .detail-stepper { display: flex; align-items: flex-start; margin-top: 1.1rem; padding-top: 0.1rem; }
        .detail-step { flex: 1 1 0; text-align: center; position: relative; }
        .detail-step-dot {
            display: block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--border-light);
            margin: 0 auto 0.4rem;
            position: relative;
            z-index: 1;
        }
        .detail-step.is-current .detail-step-dot { background-color: var(--accent-gold); }
        .detail-step-line {
            position: absolute;
            top: 6px;
            left: -50%;
            width: 100%;
            height: 2px;
            background-color: var(--border-light);
            z-index: 0;
        }
        .detail-step:first-child .detail-step-line { display: none; }
        .detail-step-label { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 700; }
        .detail-step.is-current .detail-step-label { color: var(--text-main); }
        .detail-body { padding: 1.25rem 2rem; overflow-y: auto; flex: 1 1 auto; }
        .detail-actions { display: flex; gap: 0.6rem; margin-top: 1.1rem; }
        .detail-actions .btn { flex: 1 1 auto; }
        .detail-actions .dropdown .btn { flex: 0 0 auto; }
        .detail-fields-title {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-main);
        }
        .detail-field-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.7rem 0;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.9rem;
        }
        .detail-field-label { color: var(--text-muted); flex: 0 0 auto; margin-right: 1rem; }
        .detail-field-value { font-weight: 700; color: var(--text-main); text-align: right; min-width: 0; overflow-wrap: anywhere; }
        .detail-fields {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            column-gap: 1rem;
            margin-top: 0.5rem;
        }
        .detail-field {
            min-width: 0;
            padding: 1.1rem 0;
            border-bottom: 1px solid var(--border-light);
        }
        .detail-field-full { grid-column: 1 / -1; }
        .detail-field-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.3rem;
        }
        .detail-field-text {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
            overflow-wrap: anywhere;
        }
        .detail-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            text-align: center;
            margin: 1.5rem 0;
        }
        .detail-stat-value { font-weight: 800; font-size: 1.1rem; color: var(--text-main); }
        .detail-stat-label { font-size: 0.8rem; color: var(--text-muted); }
        .detail-responses-title { font-weight: 800; font-size: 1rem; }
        .detail-responses-sub { font-size: 0.9rem; color: var(--text-muted); margin: 0.5rem 0 0.9rem; }
        #applicant-detail-answers.list-group { gap: 0.6rem; display: flex; flex-direction: column; }
        #applicant-detail-answers .list-group-item {
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 0.9rem 1.1rem;
        }
        #applicant-detail-answers .list-group-item .fw-bold { font-size: 0.9rem; }
        .detail-answer-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
        .detail-answer-pill {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-black);
            background-color: rgba(212, 175, 55, 0.12);
            border-radius: 999px;
            padding: 0.15rem 0.7rem;
        }
        .detail-answer-label { font-size: 0.8rem; color: var(--text-muted); }
        .detail-resume { margin-top: 1.5rem; }
        .resume-viewer-backdrop {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-color: rgba(0, 0, 0, 0.55);
            z-index: 1070;
        }
        .resume-viewer-backdrop.is-open { display: flex; }
        .resume-viewer {
            width: min(960px, 100%);
            height: min(92vh, 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 14px;
            background-color: var(--bg-card);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }
        .resume-viewer-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0.3rem 0.6rem;
            border-bottom: 1px solid var(--border-light);
            flex: 0 0 auto;
        }
        .resume-viewer-title { font-weight: 800; font-size: 1rem; }
        .resume-viewer-tools { display: flex; align-items: center; gap: 0.75rem; }
        .resume-viewer-newtab { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-decoration: none; }
        .resume-viewer-frame { flex: 1 1 auto; width: 100%; border: 0; background-color: #fff; }
        .detail-footer {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-light);
            padding: 0.9rem 2rem;
            display: flex;
            justify-content: space-between;
            flex: 0 0 auto;
        }
        .detail-footer-next:not(:disabled) { cursor: pointer; color: var(--text-main); }
        .detail-footer-next:disabled { opacity: 0.4; cursor: default; }
        .detail-footer-next {
            background: transparent;
            border: 0;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
    </style>
    <style>
        /* Applicants list, new shell look (part 85, 2026-11-19): overrides the rules above, CSS only. Score ring comes with a later JS step. */
        main h4 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }
        .applicants-header-icon { width: 48px; height: 48px; border-radius: 14px; }
        .applicants-header-sub { margin-top: 0.125rem; }
        .applicants-tabs { gap: 1.5rem; margin-bottom: 1.25rem; }
        .applicants-tab { font-weight: 600; color: var(--text-muted); min-height: 2.75rem; display: inline-flex; align-items: center; gap: 0.35rem; padding: 0 0.125rem; border-bottom: 3px solid transparent; }
        .applicants-tab.active { color: var(--text-main); border-bottom-color: var(--accent-gold); }
        .applicants-toolbar { gap: 0.75rem; margin-bottom: 1rem; }
        .applicants-search { min-height: 2.75rem; padding: 0 1rem; border: 1px solid var(--border-light); border-radius: 0.75rem; background-color: var(--bg-card); }
        .applicants-search:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 0.25rem rgba(201, 162, 39, 0.2); }
        .applicants-filters-btn { min-height: 2.75rem; padding: 0 1.25rem; border: 1px solid var(--text-main); border-radius: 0.75rem; background-color: transparent; }
        .applicant-card { position: relative; gap: 1rem; padding: 0.875rem 1.125rem; margin-bottom: 0.625rem; background-color: var(--bg-card); border: 1px solid var(--border-light); border-radius: 1rem; transition: transform 0.3s var(--ease), border-color 0.3s, box-shadow 0.3s; }
        .applicant-card::before { content: ""; position: absolute; left: -1px; top: 0.75rem; bottom: 0.75rem; width: 4px; border-radius: 1rem; background: var(--accent-gold); transform: scaleY(0); transition: transform 0.4s var(--ease); }
        .applicant-card:hover { background-color: var(--bg-card); border-color: var(--accent-gold); box-shadow: 0 0.5rem 1.5rem rgba(201, 162, 39, 0.14); transform: translateX(0.25rem); }
        .applicant-card:hover::before { transform: none; }
        .applicant-card:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; }
        .applicant-avatar { width: 2.75rem; height: 2.75rem; flex: 0 0 2.75rem; background-color: var(--tint); transition: background-color 0.3s, transform 0.3s var(--ease); }
        .applicant-card:hover .applicant-avatar { background-color: var(--accent-gold); transform: rotate(-8deg); }
        .applicant-who { flex: 1.6 1 0; }
        .applicant-card-name, .applicant-card-job { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .applicant-cell-brand { flex: 1 1 0; }
        .applicant-cell-date { flex: 1.2 1 0; }
        .applicant-cell-score { flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; min-width: 6.5rem; }
        .applicant-score-label { font-size: 0.6875rem; font-weight: 600; color: var(--text-muted); }
        .applicant-ring { position: relative; width: 2.75rem; height: 2.75rem; display: grid; place-items: center; }
        .applicant-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .applicant-ring circle { fill: none; stroke: var(--border-light); stroke-width: 3.5; }
        .applicant-ring .applicant-ring-arc { stroke: var(--accent-gold); stroke-linecap: round; stroke-dasharray: 100.5; transform: rotate(-90deg); transform-origin: 50% 50%; animation: applicant-ring-draw 1.1s var(--ease) both; }
        .applicant-ring b { font-size: 0.75rem; color: var(--text-main); }
        @keyframes applicant-ring-draw { from { stroke-dashoffset: 100.5; } }
        @media (prefers-reduced-motion: reduce) { .applicant-ring .applicant-ring-arc { animation: none; } }
        .applicant-status[data-status] { flex: 0 0 auto; padding: 0.25rem 0.875rem; background-color: color-mix(in srgb, currentColor 14%, transparent); }
        .applicant-status[data-status="NEW"] { color: #1D4ED8; }
        .applicant-status[data-status="HIRED"] { color: #15803D; }
        .applicant-status[data-status="POOLING"] { color: #8A6A00; }
        .applicants-footer { margin-top: 1rem; }
        .applicants-footer .btn { min-height: 2.75rem; padding: 0 1.25rem; border: 1px solid var(--border-light); border-radius: 0.75rem; background-color: transparent; color: var(--text-main); }
        .applicants-footer .btn:hover:not(:disabled) { border-color: var(--accent-gold); background-color: transparent; color: var(--text-main); }
        @media (max-width: 767.98px) { .applicant-cell-brand, .applicant-cell-date { display: none; } }
        @media (prefers-reduced-motion: reduce) { .applicant-card, .applicant-card::before, .applicant-avatar { transition: none; } .applicant-card:hover { transform: none; } }
    </style>
    <style>
        /* Applicant slide-over panel, new shell look (part 85, 2026-11-19): overrides the panel rules above, CSS only. */
        .applicant-panel-backdrop { background-color: rgba(10, 10, 10, 0.55); backdrop-filter: blur(0.25rem); }
        .applicant-panel { transition: transform 0.42s var(--ease); box-shadow: -1rem 0 3rem rgba(0, 0, 0, 0.25); overflow: hidden; }
        .applicant-panel::before { content: ""; position: absolute; inset: 0 0 auto; height: 0.3125rem; background: linear-gradient(90deg, var(--accent-gold), #E8CB62); z-index: 2; }
        @media (min-width: 641px) { .applicant-panel { border-radius: 1.25rem 0 0 1.25rem; } }
        .detail-header { background-color: var(--bg-card); padding: 1.5rem 2rem 1.125rem; }
        .detail-avatar { width: 3rem; height: 3rem; flex: 0 0 3rem; background-color: var(--accent-black); color: var(--accent-gold); }
        .detail-name { font-weight: 800; font-size: 1.25rem; letter-spacing: -0.01em; }
        .detail-close { width: 2.5rem; height: 2.5rem; border-radius: 0.625rem; display: grid; place-items: center; font-size: 1.5rem; transition: background-color 0.2s, color 0.2s; }
        .detail-close:hover { background-color: var(--hover); color: var(--text-main); }

        .detail-step.is-current .detail-step-dot { background-color: var(--accent-gold); box-shadow: 0 0 0 0.25rem rgba(201, 162, 39, 0.25); }
        .detail-step-label { font-weight: 600; }
        .detail-step.is-current .detail-step-label { font-weight: 800; }
        .detail-actions .btn { min-height: 2.75rem; border-radius: 0.75rem; }
        #applicant-detail-status-btn { background-color: var(--accent-black); border-color: var(--accent-black); color: var(--accent-gold); }
        #applicant-detail-status-btn:hover:not(:disabled), #applicant-detail-status-btn:focus-visible { background-color: #1c1a10; border-color: #1c1a10; color: var(--accent-gold); }

        .applicant-panel .dropdown-item:hover, .applicant-panel .dropdown-item:focus { background-color: var(--hover); color: var(--text-main); }
        .applicant-panel .dropdown-item.active { background-color: color-mix(in srgb, var(--accent-gold) 15%, transparent); color: var(--text-main); font-weight: 700; }
        .applicant-panel .dropdown-item.text-danger:hover { color: #b42318 !important; }
        .detail-body { padding: 1.5rem 2rem; }
        .detail-fields-title { font-size: 0.6875rem; letter-spacing: 0.09em; color: var(--text-muted); }
        .detail-field-name { font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
        .detail-field-text { font-size: 0.9375rem; font-weight: 600; }
        .detail-resume .btn { min-height: 2.75rem; border-radius: 0.75rem; border-color: var(--border-light); color: var(--text-main); background-color: transparent; }
        .detail-resume .btn:hover:not(:disabled) { border-color: var(--accent-gold); background-color: transparent; color: var(--text-main); }
        #applicant-detail-answers .list-group-item { border-radius: 1rem; }

    </style>
<style>
        /* Candidates board (2026-11-24): 7 stage columns, gold/black admin look. Variables come from admin-sidebar.css. */

        .cand-name { font-weight: 700; font-size: 0.9rem; color: var(--text-main); line-height: 1.2; }
        .cand-meta { font-size: 0.78rem; color: var(--text-muted); line-height: 1.3; }
        .cand-card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 0.65rem; }
        .cand-assignee { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--text-muted); min-width: 0; }
        .cand-assignee-av { flex: 0 0 1.4rem; width: 1.4rem; height: 1.4rem; border-radius: 50%; background-color: var(--accent-black); color: var(--accent-gold); font-size: 0.62rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
        .cand-score { font-size: 0.72rem; font-weight: 700; padding: 0.15rem 0.55rem; border-radius: 999px; border: 1px solid var(--border-light); color: var(--text-muted); }
        .cand-score.is-good { background-color: var(--tint); color: var(--text-main); }
        .cand-score.is-strong { background-color: var(--accent-black); color: var(--accent-gold); border-color: var(--accent-black); }
        .cand-card { cursor: pointer; }
        .cand-card:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; }
        #cand-panel-avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; }
        #cand-panel-stepper { padding-bottom: 0.25rem; }
        .cand-step { background: none; border: 0; padding: 0 0.15rem; cursor: pointer; font: inherit; }
        .cand-step:disabled { cursor: progress; opacity: 0.6; }
        .cand-step:not(:disabled):not(.is-current):hover .detail-step-dot { background-color: var(--accent-gold); opacity: 0.6; }
        .cand-step:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; border-radius: 0.5rem; }
        #cand-panel-msg { margin-bottom: 1rem; }
        .cand-assign { margin-bottom: 1.25rem; }
        .cand-assign .detail-field-name { display: block; margin-bottom: 0.4rem; }
        .cand-assign .form-select { min-height: 2.75rem; border-radius: 0.75rem; border-color: var(--border-light); }
        .cand-assign .form-select:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 0.2rem rgba(201, 162, 39, 0.25); }
        #cand-detail-msg { margin-bottom: 1rem; }
        .cand-details .detail-fields-title { margin-top: 0.5rem; }
    </style>
</head>
<body>
    {% set active_page = 'candidates' %}
    <div class="container-fluid p-0">
        <div class="row g-0">
            {% include '_sidebar.html' %}

            <main class="col-md-10 px-4 pb-5">
                <div class="d-flex align-items-center gap-3 mt-4 mb-4">
                    <div>
                        <h4 class="fw-bold mb-0">Candidates</h4>
                        <div class="cand-sub" id="cand-sub">Loading candidates&hellip;</div>
                    </div>
                </div>

                <div class="cand-toolbar">
                    <input type="search" class="form-control applicants-search" id="cand-search" placeholder="Search by name, position or brand" maxlength="100" autocomplete="off" aria-label="Search candidates">
                    <button type="button" class="btn applicants-filters-btn" disabled>Filters</button>
                </div>
                <div class="cand-notice" id="cand-notice" role="status" hidden></div>
                <div class="cand-board" id="cand-board" aria-label="Candidates by hiring stage"></div>
                <div class="applicants-footer">
                    <span class="applicants-count" id="candidates-count"></span>
                </div>

            </main>
        </div>
    </div>
    <div class="applicant-panel-backdrop" id="cand-panel-backdrop" aria-hidden="true"></div>
    <div class="applicant-panel" id="cand-panel" role="dialog" aria-modal="true" aria-labelledby="cand-panel-name" aria-hidden="true">
        <div class="detail-header">
            <div class="d-flex align-items-center gap-3">
                <div class="detail-avatar" id="cand-panel-avatar" aria-hidden="true">&mdash;</div>
                <div class="flex-grow-1">
                    <span class="detail-name" id="cand-panel-name"></span>
                    <div class="detail-subline" id="cand-panel-subline"></div>
                </div>
                <button type="button" class="detail-close" id="cand-panel-close" aria-label="Close">&times;</button>
            </div>
            <div class="detail-stepper" id="cand-panel-stepper"></div>
        </div>
        <div class="detail-body">
            <div class="cand-notice" id="cand-panel-msg" role="alert" hidden></div>
            <div class="cand-assign">
                <label class="detail-field-name" for="cand-assignee">Assigned To</label>
                <select class="form-select" id="cand-assignee" disabled><option value="">Loading...</option></select>
                <div class="text-muted small mt-1" id="cand-assignee-note" hidden></div>
            </div>
            <div class="cand-details">
                <div class="cand-notice" id="cand-detail-msg" role="alert" hidden></div>
                <div class="detail-fields-title">Application details</div>
                <div class="detail-fields">
                    <div class="detail-field"><div class="detail-field-name">Position</div><div class="detail-field-text" id="cand-d-position">&mdash;</div></div>
                    <div class="detail-field"><div class="detail-field-name">Brand</div><div class="detail-field-text" id="cand-d-brand">&mdash;</div></div>
                    <div class="detail-field"><div class="detail-field-name">Classification</div><div class="detail-field-text" id="cand-d-class">&mdash;</div></div>
                    <div class="detail-field"><div class="detail-field-name">Employment type</div><div class="detail-field-text" id="cand-d-type">&mdash;</div></div>
                    <div class="detail-field"><div class="detail-field-name">Score</div><div class="detail-field-text" id="cand-d-score">&mdash;</div></div>
                    <div class="detail-field"><div class="detail-field-name">Moved to candidates</div><div class="detail-field-text" id="cand-d-moved">&mdash;</div></div>
                </div>
                <div class="detail-fields-title">Candidate information</div>
                <div class="detail-fields">
                    <div class="detail-field"><div class="detail-field-name">Contact number</div><div class="detail-field-text" id="cand-d-phone">&mdash;</div></div>
                    <div class="detail-field"><div class="detail-field-name">Age</div><div class="detail-field-text" id="cand-d-age">&mdash;</div></div>
                    <div class="detail-field"><div class="detail-field-name">Gender</div><div class="detail-field-text" id="cand-d-gender">&mdash;</div></div>
                    <div class="detail-field detail-field-full"><div class="detail-field-name">Email</div><div class="detail-field-text" id="cand-d-email">&mdash;</div></div>
                    <div class="detail-field detail-field-full"><div class="detail-field-name">Address</div><div class="detail-field-text" id="cand-d-address">&mdash;</div></div>
                </div>
            </div>
            <div class="detail-resume">
                <button type="button" class="btn btn-outline-dark fw-bold w-100" id="cand-resume-btn">View resume</button>
            </div>
        </div>
    </div>
    <div class="resume-viewer-backdrop" id="resumeViewerBackdrop" aria-hidden="true">
        <div class="resume-viewer" role="dialog" aria-modal="true" aria-label="Resume">
            <div class="resume-viewer-header">
                <button type="button" class="detail-close" data-resume-close aria-label="Close resume">&times;</button>
            </div>
            <iframe class="resume-viewer-frame" id="resumeViewerFrame" title="Applicant resume" src="about:blank"></iframe>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin-sidebar.js"></script>
    <script>
    (function () {
        // Stage keys are the backend CANDIDATE_STAGE_VALUES (API_CONTRACT GET /candidates); titles are display labels only.
        var STAGES = [
            ['initial_interview', 'For Initial Interview'],
            ['qualifiers_exam', "For Qualifier's Exam"],
            ['final_interview', 'For Final Interview'],
            ['requirements', 'For Requirements'],
            ['background_check', 'For Background Checking'],
            ['onboarding', 'For Onboarding'],
            ['onboarded', 'Onboarded']
        ];
        var LIMIT = 100;
        var boardEl = document.getElementById('cand-board');
        var searchEl = document.getElementById('cand-search');
        var subEl = document.getElementById('cand-sub');
        var noticeEl = document.getElementById('cand-notice');
        var countEl = document.getElementById('candidates-count');
        var seq = 0;
        var timer = null;
        var lastData = null;

        function el(tag, cls, text) {
            var n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text !== undefined && text !== null) n.textContent = text;
            return n;
        }
        function initials(name) {
            var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
            if (!parts.length) return '?';
            var a = parts[0].charAt(0);
            var b = parts.length > 1 ? parts[parts.length - 1].charAt(0) : '';
            return (a + b).toUpperCase();
        }
        function showNotice(msg) {
            if (msg) { noticeEl.textContent = msg; noticeEl.hidden = false; }
            else { noticeEl.textContent = ''; noticeEl.hidden = true; }
        }
        function buildCard(item) {
            var card = el('div', 'cand-card');
            card.tabIndex = 0;
            card.setAttribute('role', 'button');
            card.addEventListener('click', function () { openPanel(item.id); });
            card.addEventListener('keydown', function (ev) {
                if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openPanel(item.id); }
            });
            var top = el('div', 'cand-card-top');
            top.appendChild(el('span', 'cand-avatar', initials(item.applicant_name)));
            var txt = el('div');
            txt.appendChild(el('div', 'cand-name', item.applicant_name || '-'));
            txt.appendChild(el('div', 'cand-meta', (item.job_title || '-') + ' \u00b7 ' + (item.brand_name || '-')));
            top.appendChild(txt);
            card.appendChild(top);
            var bottom = el('div', 'cand-card-bottom');
            var who = el('span', 'cand-assignee');
            if (item.assigned_to && item.assigned_to.name) {
                who.appendChild(el('span', 'cand-assignee-av', initials(item.assigned_to.name)));
                who.appendChild(el('span', null, String(item.assigned_to.name).split(/\s+/)[0]));
            } else {
                who.textContent = 'Unassigned';
            }
            bottom.appendChild(who);
            if (typeof item.score === 'number') {
                var tier = item.score >= 85 ? ' is-strong' : (item.score >= 60 ? ' is-good' : '');
                bottom.appendChild(el('span', 'cand-score' + tier, String(item.score)));
            }
            card.appendChild(bottom);
            return card;
        }
        function render(data) {
            if (data) lastData = data;
            var rows = (data && data.data) || [];
            var counts = (data && data.stage_counts) || null;
            var byStage = {};
            rows.forEach(function (r) { (byStage[r.stage] = byStage[r.stage] || []).push(r); });
            boardEl.textContent = '';
            STAGES.forEach(function (s, i) {
                var col = el('section', 'cand-col');
                var head = el('div', 'cand-col-head');
                head.appendChild(el('span', 'cand-col-title', s[1]));
                var n = counts ? (counts[s[0]] || 0) : null;
                head.appendChild(el('span', 'cand-col-count', n === null ? '-' : String(n)));
                col.appendChild(head);
                var body = el('div', 'cand-col-body');
                var list = byStage[s[0]] || [];
                if (counts && !list.length) body.appendChild(el('div', 'cand-empty', 'No candidates'));
                list.forEach(function (r) { body.appendChild(buildCard(r)); });
                col.appendChild(body);
                boardEl.appendChild(col);
            });
            if (data) {
                var total = data.total || 0;
                subEl.textContent = total + (total === 1 ? ' candidate' : ' candidates') + ' moving through the hiring pipeline';
                countEl.textContent = 'Showing ' + rows.length + ' of ' + total;
                showNotice(total > rows.length ? 'Showing the latest ' + rows.length + ' of ' + total + ' candidates. Use the search box to narrow the board.' : '');
            }
        }
        function load() {
            var mine = ++seq;
            var q = searchEl.value.trim();
            var url = '/api/v1/admin/candidates?limit=' + LIMIT + (q ? '&search=' + encodeURIComponent(q) : '');
            fetch(url, { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function (d) { if (mine === seq) render(d); })
                .catch(function (err) {
                    if (mine !== seq) return;
                    showNotice('Could not load candidates (' + err.message + '). Reload the page or sign in again.');
                    subEl.textContent = 'Candidates could not be loaded';
                    countEl.textContent = '';
                });
        }
        var panelEl = document.getElementById('cand-panel');
        var backdropEl = document.getElementById('cand-panel-backdrop');
        var stepperEl = document.getElementById('cand-panel-stepper');
        var panelMsgEl = document.getElementById('cand-panel-msg');
        var closeBtn = document.getElementById('cand-panel-close');
        var assigneeEl = document.getElementById('cand-assignee');
        var assigneeNoteEl = document.getElementById('cand-assignee-note');
        var assignees = null;
        var assigneesLoading = false;
        var assigneesFailed = false;
        var detailToken = 0;
        var current = null;
        var busy = false;

        function showPanelMsg(msg) {
            if (msg) { panelMsgEl.textContent = msg; panelMsgEl.hidden = false; }
            else { panelMsgEl.textContent = ''; panelMsgEl.hidden = true; }
        }
        function renderStepper() {
            stepperEl.textContent = '';
            renderAssignee();
            STAGES.forEach(function (s) {
                var isCur = !!current && current.stage === s[0];
                var b = el('button', 'detail-step cand-step' + (isCur ? ' is-current' : ''));
                b.type = 'button';
                b.disabled = busy;
                b.setAttribute('aria-label', 'Move to ' + s[1]);
                if (isCur) b.setAttribute('aria-current', 'step');
                b.appendChild(el('span', 'detail-step-line'));
                b.appendChild(el('span', 'detail-step-dot'));
                b.appendChild(el('span', 'detail-step-label', s[1]));
                b.addEventListener('click', function () { changeStage(s[0]); });
                stepperEl.appendChild(b);
            });
        }
        function openPanel(id) {
            var found = null;
            ((lastData && lastData.data) || []).forEach(function (r) { if (r.id === id) found = r; });
            if (!found) return;
            current = found;
            document.getElementById('cand-panel-avatar').textContent = initials(found.applicant_name);
            document.getElementById('cand-panel-name').textContent = found.applicant_name || '-';
            document.getElementById('cand-panel-subline').textContent = (found.job_title || '-') + ' \u00b7 ' + (found.brand_name || '-');
            showPanelMsg('');
            renderStepper();
            panelEl.classList.add('is-open');
            backdropEl.classList.add('is-open');
            panelEl.setAttribute('aria-hidden', 'false');
            backdropEl.setAttribute('aria-hidden', 'false');
            closeBtn.focus();
            loadDetails(found);
            loadAssignees();
        }
        function closePanel() {
            panelEl.classList.remove('is-open');
            backdropEl.classList.remove('is-open');
            panelEl.setAttribute('aria-hidden', 'true');
            backdropEl.setAttribute('aria-hidden', 'true');
            detailToken++;
            closeResumeViewer();
            current = null;
        }
        function applyUpdated(updated) {
            if (!lastData || !lastData.data) return;
            var idx = -1;
            lastData.data.forEach(function (r, i) { if (r.id === updated.id) idx = i; });
            if (idx < 0) return;
            var old = lastData.data[idx];
            if (old.stage !== updated.stage && lastData.stage_counts) {
                lastData.stage_counts[old.stage] = Math.max(0, (lastData.stage_counts[old.stage] || 0) - 1);
                lastData.stage_counts[updated.stage] = (lastData.stage_counts[updated.stage] || 0) + 1;
            }
            lastData.data[idx] = updated;
            render(lastData);
        }
        function changeStage(newStage) {
            if (!current || busy || current.stage === newStage) return;
            busy = true;
            showPanelMsg('');
            renderStepper();
            fetch('/api/v1/admin/candidates/' + encodeURIComponent(current.id), {
                method: 'PATCH',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ stage: newStage })
            })
                .then(function (r) {
                    return r.json().catch(function () { return null; }).then(function (b) {
                        if (!r.ok) throw new Error(b && typeof b.detail === 'string' ? b.detail : 'HTTP ' + r.status);
                        return b;
                    });
                })
                .then(function (updated) {
                    applyUpdated(updated);
                    if (current && current.id === updated.id) current = updated;
                    busy = false;
                    renderStepper();
                })
                .catch(function (err) {
                    busy = false;
                    renderStepper();
                    showPanelMsg('Could not change the stage: ' + err.message);
                });
        }
        function setDetail(id, v) {
            document.getElementById(id).textContent = (v === null || v === undefined || v === '') ? '\u2014' : String(v);
        }
        function formatMoved(iso) {
            if (!iso) return null;
            var d = new Date(iso);
            if (isNaN(d.getTime())) return null;
            return d.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' });
        }
        function loadDetails(item) {
            var token = ++detailToken;
            var msgEl = document.getElementById('cand-detail-msg');
            msgEl.textContent = '';
            msgEl.hidden = true;
            setDetail('cand-d-position', item.job_title);
            setDetail('cand-d-brand', item.brand_name);
            setDetail('cand-d-class', item.employee_classification);
            setDetail('cand-d-type', item.job_type);
            setDetail('cand-d-score', item.score === null || item.score === undefined ? null : item.score + ' / 100');
            setDetail('cand-d-moved', formatMoved(item.moved_at));
            ['phone', 'age', 'gender', 'email', 'address'].forEach(function (k) { setDetail('cand-d-' + k, null); });
            fetch('/api/v1/admin/applications/' + encodeURIComponent(item.application_id), { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
                .then(readJson)
                .then(function (b) {
                    if (token !== detailToken) return;
                    var a = (b && b.applicant) || {};
                    setDetail('cand-d-phone', a.phone);
                    setDetail('cand-d-age', a.age);
                    setDetail('cand-d-gender', a.gender);
                    setDetail('cand-d-email', a.email);
                    setDetail('cand-d-address', a.address);
                })
                .catch(function (err) {
                    if (token !== detailToken) return;
                    msgEl.textContent = 'Could not load the candidate details: ' + err.message;
                    msgEl.hidden = false;
                });
        }
        function readJson(r) {
            return r.json().catch(function () { return null; }).then(function (b) {
                if (!r.ok) throw new Error(b && typeof b.detail === 'string' ? b.detail : 'HTTP ' + r.status);
                return b;
            });
        }
        function addOption(value, text) {
            var o = document.createElement('option');
            o.value = value;
            o.textContent = text;
            assigneeEl.appendChild(o);
        }
        function renderAssignee() {
            assigneeEl.textContent = '';
            if (assignees === null) {
                addOption('', assigneesFailed ? 'Unavailable' : 'Loading...');
                assigneeEl.disabled = true;
                return;
            }
            var cur = current && current.assigned_to ? current.assigned_to : null;
            var inList = false;
            addOption('', 'Unassigned');
            assignees.forEach(function (u) {
                if (cur && cur.id === u.id) inList = true;
                addOption(u.id, u.name + ' (' + u.role + ')');
            });
            if (cur && !inList) addOption(cur.id, cur.name + ' (not in the list)');
            assigneeEl.value = cur ? cur.id : '';
            assigneeEl.disabled = busy || !current;
        }
        function loadAssignees() {
            if (assignees !== null || assigneesLoading) return;
            assigneesLoading = true;
            assigneesFailed = false;
            assigneeNoteEl.hidden = true;
            fetch('/api/v1/admin/candidate-assignees?limit=200', { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
                .then(readJson)
                .then(function (b) {
                    assignees = (b && b.data) || [];
                    assigneesLoading = false;
                    if (b && b.total > assignees.length) {
                        assigneeNoteEl.textContent = 'Showing the first ' + assignees.length + ' of ' + b.total + ' users.';
                        assigneeNoteEl.hidden = false;
                    }
                    renderAssignee();
                })
                .catch(function (err) {
                    assigneesLoading = false;
                    assigneesFailed = true;
                    assigneeNoteEl.textContent = 'Could not load the user list: ' + err.message;
                    assigneeNoteEl.hidden = false;
                    renderAssignee();
                });
        }
        function changeAssignee() {
            if (!current || busy) return;
            var newId = assigneeEl.value || null;
            var oldId = current.assigned_to ? current.assigned_to.id : null;
            if (newId === oldId) return;
            var id = current.id;
            busy = true;
            showPanelMsg('');
            renderStepper();
            fetch('/api/v1/admin/candidates/' + encodeURIComponent(id), {
                method: 'PATCH',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ assigned_to_id: newId })
            })
                .then(readJson)
                .then(function (updated) {
                    applyUpdated(updated);
                    if (current && current.id === updated.id) current = updated;
                    busy = false;
                    renderStepper();
                })
                .catch(function (err) {
                    busy = false;
                    renderStepper();
                    showPanelMsg('Could not change the assignee: ' + err.message);
                });
        }
        assigneeEl.addEventListener('change', changeAssignee);
        function isResumeViewerOpen() {
            return document.getElementById('resumeViewerBackdrop').classList.contains('is-open');
        }
        function openResumeViewer() {
            if (!current || !current.application_id) return;
            var url = '/api/v1/admin/applications/' + encodeURIComponent(current.application_id) + '/resume';
            var b = document.getElementById('resumeViewerBackdrop');
            document.getElementById('resumeViewerFrame').src = url + '#toolbar=0&navpanes=0&view=FitH';
            b.classList.add('is-open');
            b.setAttribute('aria-hidden', 'false');
        }
        function closeResumeViewer() {
            var b = document.getElementById('resumeViewerBackdrop');
            b.classList.remove('is-open');
            b.setAttribute('aria-hidden', 'true');
            document.getElementById('resumeViewerFrame').src = 'about:blank';
        }
        document.getElementById('cand-resume-btn').addEventListener('click', openResumeViewer);
        document.addEventListener('click', function (ev) {
            if (ev.target.closest('[data-resume-close]') || ev.target.id === 'resumeViewerBackdrop') closeResumeViewer();
        });
        closeBtn.addEventListener('click', closePanel);
        backdropEl.addEventListener('click', closePanel);
        document.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Escape') return;
            if (isResumeViewerOpen()) { closeResumeViewer(); return; }
            if (panelEl.classList.contains('is-open')) closePanel();
        });

        searchEl.addEventListener('input', function () {
            clearTimeout(timer);
            timer = setTimeout(load, 300);
        });
        render(null);
        load();
    })();
    </script>

</body>
</html>
