<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTE Careers - HR Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/admin-sidebar.css" rel="stylesheet">
    <style>

        /* Top Bar Styling */
        .top-bar {
            padding: 1.5rem 0;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-box, .date-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            box-shadow: var(--soft-shadow);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-family: inherit;
        }
        .search-box:focus, .date-box:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
        .btn-profile {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            box-shadow: var(--soft-shadow);
            color: var(--text-main);
            font-weight: 700;
            padding: 0.6rem 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-profile:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* Card Styling */
        .dashboard-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            box-shadow: var(--soft-shadow);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }
        .stat-value {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--accent-black);
        }

        /* Pass Rate Specific */
        .pass-rate-box {
            position: relative;
        }
        .pass-rate-box::after, .col-divider::after {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background-color: var(--border-light);
        }
        .pass-rate-sub {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Table Styling */
        .table {
            color: var(--text-main);
            margin-bottom: 0;
        }
        .table th {
            border-bottom: 2px solid var(--border-light);
            color: var(--text-muted);
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 1rem 0.5rem;
        }
        .table td {
            border-bottom: 1px solid var(--border-light);
            background-color: transparent;
            vertical-align: middle;
            font-weight: 700;
            padding: 1rem 0.5rem;
        }
        .badge-auto {
            background-color: var(--bg-main);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            font-weight: 700;
            padding: 0.4rem 0.8rem;
            border-radius: 12px;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    {% set active_page = 'dashboard' %}
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sidebar -->
            {% include '_sidebar.html' %}

            <!-- Main Content -->
            <main class="col-md-10 px-4 pb-5">
                <!-- Top Nav -->
                <div class="top-bar">
                    <div class="d-flex gap-3">
                        <input type="text" class="search-box" placeholder="Search..." style="width: 250px;">
                        <input type="date" class="date-box">
                    </div>
                    <button class="btn-profile">PROFILE</button>
                </div>

                <!-- Aggregate Summary Card -->
                <div class="dashboard-card mb-4">
                    <div class="row text-center align-items-center" id="main-summary">
                        <!-- Populated by JS -->
                        <div class="col"><span class="text-muted fw-bold">Loading metrics...</span></div>
                    </div>
                </div>

                <!-- Top Matches Cards -->
                <div class="row mb-4" id="brand-summary-cards">
                    <!-- Populated by JS -->
                </div>

                <!-- Live Tally Table -->
                <div class="dashboard-card">
                    <div class="d-flex justify-content-between align-items-center mb-3 px-2">
                        <h5 class="m-0 fw-bold">Live Status Tally</h5>
                        <span class="badge-auto">Auto-updating</span>
                    </div>
                    <div class="table-responsive px-2">
                        <table class="table table-borderless table-hover">
                            <thead>
                                <tr>
                                    <th>Job Title</th>
                                    <th>New</th>
                                    <th>Passed</th>
                                    <th>Failed</th>
                                    <th>Pooling</th>
                                    <th>Endorsed</th>
                                    <th>Hired</th>
                                </tr>
                            </thead>
                            <tbody id="tally-body">
                                <!-- Populated by JS -->
                                <tr><td colspan="7" class="text-center text-muted fw-bold py-4">Loading pipeline...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    {% include '_form_builder.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin-sidebar.js"></script>
    <script>
        async function fetchDashboardData() {
            try {
                // Fetch summary
                const summaryRes = await fetch('/api/v1/admin/dashboard/summary');
                if (summaryRes.ok) {
                    const summaryData = await summaryRes.json();
                    const stats = summaryData.overall_totals || {};
                    
                    const passed = stats.passed || 0;
                    const total = stats.total_processed || 0;
                    const passRate = total > 0 ? Math.round((passed / total) * 100) : 0;
                    
                    document.getElementById('main-summary').innerHTML = `
                        <div class="col col-divider">
                            <div class="stat-label">New</div>
                            <div class="stat-value" style="color: var(--text-muted);">${stats.new || 0}</div>
                        </div>
                        <div class="col pass-rate-box">
                            <div class="stat-label">Pass Rate</div>
                            <div class="stat-value" style="color: var(--accent-gold);">${passRate}%</div>
                            <div class="pass-rate-sub">${passed}/${total}</div>
                        </div>
                        <div class="col col-divider">
                            <div class="stat-label">Endorsed</div>
                            <div class="stat-value" style="color: var(--accent-black);">${stats.endorsed || 0}</div>
                        </div>
                        <div class="col col-divider">
                            <div class="stat-label">Pooling</div>
                            <div class="stat-value" style="color: var(--text-muted);">${stats.pooling || 0}</div>
                        </div>
                        <div class="col col-divider">
                            <div class="stat-label">Hired</div>
                            <div class="stat-value" style="color: var(--accent-gold);">${stats.hired || 0}</div>
                        </div>
                        <div class="col">
                            <div class="stat-label">Failed</div>
                            <div class="stat-value" style="color: var(--accent-black);">${stats.failed || 0}</div>
                        </div>
                    `;

                    if (summaryData.brand_matches && summaryData.brand_matches.length > 0) {
                        document.getElementById('brand-summary-cards').innerHTML = summaryData.brand_matches.map(b => `
                            <div class="col-md-4">
                                <div class="dashboard-card h-100 d-flex justify-content-between align-items-center mb-0">
                                    <div>
                                        <div class="stat-label mb-0" style="color: var(--text-main); font-size: 0.85rem;">${b.name}</div>
                                        <div class="stat-label mt-1" style="font-size: 0.65rem;">Top Matches</div>
                                    </div>
                                    <div class="stat-value" style="color: var(--accent-gold);">${b.matches || 0}</div>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        document.getElementById('brand-summary-cards').innerHTML = '<div class="col-12"><span class="text-muted small fw-bold">No brand data yet</span></div>';
                    }
                }

                // Fetch tally
                const tallyRes = await fetch('/api/v1/admin/dashboard/tally');
                if (tallyRes.ok) {
                    const tallyData = await tallyRes.json();
                    document.getElementById('tally-body').innerHTML = tallyData.data.map(t => `
                        <tr>
                            <td class="fw-bold">${t.job_title}</td>
                            <td style="color: var(--text-muted);">${t.counts.NEW || 0}</td>
                            <td style="color: var(--accent-gold);">${t.counts.PASSED || 0}</td>
                            <td style="color: var(--accent-black);">${t.counts.FAILED || 0}</td>
                            <td style="color: var(--text-muted);">${t.counts.POOLING || 0}</td>
                            <td style="color: var(--accent-black);">${t.counts.ENDORSED || 0}</td>
                            <td style="color: var(--accent-gold);">${t.counts.HIRED || 0}</td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error("Failed to load dashboard data:", err);
            }
        }

        fetchDashboardData();
        setInterval(fetchDashboardData, 10000);

    </script>

</body>
</html>
