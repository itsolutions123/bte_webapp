<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTE Careers - HR Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f4f6f8;
            --bg-card: #ffffff;
            --text-main: #111111;
            --text-muted: #6c757d;
            
            /* Gold, Black, White Palette */
            --accent-gold: #d4af37;
            --accent-black: #111111;
            --accent-white: #ffffff;
            --border-light: #eaedf1;

            /* Soft Box Shadows */
            --soft-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text-main);
            font-family: 'Nunito', sans-serif;
            font-size: 0.9rem;
        }

        /* Sidebar Styling */
        .sidebar { 
            background-color: var(--bg-card);
            border-right: 1px solid var(--border-light);
            min-height: 100vh; 
            padding: 2rem 1.5rem;
            z-index: 10;
        }
        .sidebar-brand {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            margin-bottom: 2.5rem;
            color: var(--accent-black);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar-brand .logo-box {
            width: 28px;
            height: 28px;
            background-color: var(--accent-gold);
            border-radius: 8px;
            display: inline-block;
        }
        .nav-section {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 800;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            padding-left: 0.5rem;
            display: flex;
            justify-content: space-between;
        }
        .sidebar a { 
            color: var(--text-main); 
            text-decoration: none; 
            font-weight: 600;
            display: block; 
            padding: 0.6rem 1rem; 
            border-radius: 12px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
        }
        .sidebar a:hover { 
            background-color: #f8f9fa; 
            color: var(--accent-gold);
        }
        .sidebar a.active { 
            background-color: var(--accent-black); 
            color: var(--accent-gold);
        }

        /* Form row: 3-dot button + floating menu (SHELL: actions not wired yet) */
        .form-row { position: relative; display: flex; align-items: center; }
        .form-row > a { flex: 1; min-width: 0; }
        .form-menu-btn {
            background: none; border: 0; color: var(--text-muted);
            font-size: 1.2rem; line-height: 1; padding: 0.25rem 0.6rem;
            border-radius: 8px; margin-bottom: 6px; cursor: pointer;
        }
        .form-menu-btn:hover { background-color: #f8f9fa; color: var(--accent-black); }
        .form-menu {
            position: absolute; right: 0; top: 100%; z-index: 20;
            display: flex; gap: 4px; padding: 6px;
            background-color: var(--bg-card); border: 1px solid var(--border-light);
            border-radius: 12px; box-shadow: var(--soft-shadow);
        }
        .form-menu[hidden] { display: none; }
        .form-menu-item {
            background: none; border: 0; color: var(--text-main);
            padding: 0.4rem 0.55rem; border-radius: 8px; cursor: pointer; line-height: 1;
        }
        .form-menu-item:hover { background-color: #f8f9fa; color: var(--accent-gold); }

        /* Top Bar Styling */
        .top-bar {
            padding: 1.5rem 0;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-box, .date-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            box-shadow: var(--soft-shadow);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-family: inherit;
        }
        .search-box:focus, .date-box:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
        .btn-profile {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            box-shadow: var(--soft-shadow);
            color: var(--text-main);
            font-weight: 700;
            padding: 0.6rem 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-profile:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* Card Styling */
        .dashboard-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            box-shadow: var(--soft-shadow);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }
        .stat-value {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--accent-black);
        }

        /* Pass Rate Specific */
        .pass-rate-box {
            position: relative;
        }
        .pass-rate-box::after, .col-divider::after {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background-color: var(--border-light);
        }
        .pass-rate-sub {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Table Styling */
        .table {
            color: var(--text-main);
            margin-bottom: 0;
        }
        .table th {
            border-bottom: 2px solid var(--border-light);
            color: var(--text-muted);
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 1rem 0.5rem;
        }
        .table td {
            border-bottom: 1px solid var(--border-light);
            background-color: transparent;
            vertical-align: middle;
            font-weight: 700;
            padding: 1rem 0.5rem;
        }
        .badge-auto {
            background-color: var(--bg-main);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            font-weight: 700;
            padding: 0.4rem 0.8rem;
            border-radius: 12px;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sidebar -->
            <nav class="col-md-2 sidebar d-none d-md-block">
                <div class="sidebar-brand">
                    <span class="logo-box"></span>
                    BIGTIME EMPIRE
                </div>

                <div class="nav-section">WORKSPACE</div>
                <div class="nav flex-column">
                    <a href="#" class="active">Dashboard</a>
                    <a href="#">Applicants</a>
                </div>

                <div class="nav-section">
                    BRANDS <span>+</span>
                </div>
                <div class="nav flex-column" id="brand-list">
                    <!-- Populated by JS -->
                    <span class="px-3 text-muted small fw-bold">Loading...</span>
                </div>

                <div class="nav-section">
                    FORMS <span role="button" data-bs-toggle="modal" data-bs-target="#formBuilderModal" aria-label="Add form">+</span>
                </div>
                <div class="nav flex-column" id="form-list">
                    <!-- Populated by JS -->
                </div>
            <div class="nav flex-column mt-4">
                    <a href="/admin/archive">Archive</a>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-10 px-4 pb-5">
                <!-- Top Nav -->
                <div class="top-bar">
                    <div class="d-flex gap-3">
                        <input type="text" class="search-box" placeholder="Search..." style="width: 250px;">
                        <input type="date" class="date-box">
                    </div>
                    <button class="btn-profile">PROFILE</button>
                </div>

                <!-- Aggregate Summary Card -->
                <div class="dashboard-card mb-4">
                    <div class="row text-center align-items-center" id="main-summary">
                        <!-- Populated by JS -->
                        <div class="col"><span class="text-muted fw-bold">Loading metrics...</span></div>
                    </div>
                </div>

                <!-- Top Matches Cards -->
                <div class="row mb-4" id="brand-summary-cards">
                    <!-- Populated by JS -->
                </div>

                <!-- Live Tally Table -->
                <div class="dashboard-card">
                    <div class="d-flex justify-content-between align-items-center mb-3 px-2">
                        <h5 class="m-0 fw-bold">Live Status Tally</h5>
                        <span class="badge-auto">Auto-updating</span>
                    </div>
                    <div class="table-responsive px-2">
                        <table class="table table-borderless table-hover">
                            <thead>
                                <tr>
                                    <th>Job Title</th>
                                    <th>Passed</th>
                                    <th>Failed</th>
                                    <th>Pooling</th>
                                    <th>Endorsed</th>
                                    <th>Hired</th>
                                </tr>
                            </thead>
                            <tbody id="tally-body">
                                <!-- Populated by JS -->
                                <tr><td colspan="6" class="text-center text-muted fw-bold py-4">Loading pipeline...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Form 3-dot menu: open/close only (rename/archive not wired yet)
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.form-menu-btn');
            document.querySelectorAll('.form-menu').forEach(m => {
                const owner = m.parentElement.querySelector('.form-menu-btn');
                const open = !!btn && owner === btn && m.hidden;
                m.hidden = !open;
                owner.setAttribute('aria-expanded', open);
            });
        });

        async function fetchDashboardData() {
            try {
                // Fetch sidebar metadata
                const sidebarRes = await fetch('/api/v1/admin/metadata/sidebar');
                if (sidebarRes.ok) {
                    const sidebarData = await sidebarRes.json();
                    
                    document.getElementById('brand-list').innerHTML = (sidebarData.brands || []).map(b =>
                        `<a href="#">${b.name}</a>`
                    ).join('');
                    
                    if (sidebarData.forms && sidebarData.forms.length > 0) {
                        document.getElementById('form-list').innerHTML = sidebarData.forms.map(f =>
                            `<div class="form-row">
                                <a href="#">${f.name}</a>
                                <button type="button" class="form-menu-btn" aria-label="Form options" aria-haspopup="true" aria-expanded="false">&#8942;</button>
                                <div class="form-menu" hidden>
                                    <button type="button" class="form-menu-item" title="Rename form" aria-label="Rename form">
                                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/></svg>
                                    </button>
                                    <button type="button" class="form-menu-item" title="Archive form" aria-label="Archive form">
                                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M0 2a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1v7.5a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 1 12.5V5a1 1 0 0 1-1-1V2zm2 3v7.5A1.5 1.5 0 0 0 3.5 14h9a1.5 1.5 0 0 0 1.5-1.5V5H2zm13-3H1v2h14V2zM5 7.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5z"/></svg>
                                    </button>
                                </div>
                            </div>`
                        ).join('');
                    } else {
                        document.getElementById('form-list').innerHTML = '<span class="px-3 text-muted small fw-bold">No forms yet</span>';
                    }
                }

                // Fetch summary
                const summaryRes = await fetch('/api/v1/admin/dashboard/summary');
                if (summaryRes.ok) {
                    const summaryData = await summaryRes.json();
                    const stats = summaryData.overall_totals || {};
                    
                    const passed = stats.passed || 0;
                    const total = stats.total_processed || 1;
                    const passRate = total > 0 && stats.total_processed !== undefined ? Math.round((passed / total) * 100) : 0;
                    
                    document.getElementById('main-summary').innerHTML = `
                        <div class="col pass-rate-box">
                            <div class="stat-label">Pass Rate</div>
                            <div class="stat-value" style="color: var(--accent-gold);">${passRate}%</div>
                            <div class="pass-rate-sub">${passed}/${total === 1 && stats.total_processed === undefined ? 0 : total}</div>
                        </div>
                        <div class="col col-divider">
                            <div class="stat-label">Endorsed</div>
                            <div class="stat-value" style="color: var(--accent-black);">${stats.endorsed || 0}</div>
                        </div>
                        <div class="col col-divider">
                            <div class="stat-label">Pooling</div>
                            <div class="stat-value" style="color: var(--text-muted);">${stats.pooling || 0}</div>
                        </div>
                        <div class="col col-divider">
                            <div class="stat-label">Hired</div>
                            <div class="stat-value" style="color: var(--accent-gold);">${stats.hired || 0}</div>
                        </div>
                        <div class="col">
                            <div class="stat-label">Failed</div>
                            <div class="stat-value" style="color: var(--accent-black);">${stats.failed || 0}</div>
                        </div>
                    `;

                    if (summaryData.brand_matches && summaryData.brand_matches.length > 0) {
                        document.getElementById('brand-summary-cards').innerHTML = summaryData.brand_matches.map(b => `
                            <div class="col-md-4">
                                <div class="dashboard-card h-100 d-flex justify-content-between align-items-center mb-0">
                                    <div>
                                        <div class="stat-label mb-0" style="color: var(--text-main); font-size: 0.85rem;">${b.name}</div>
                                        <div class="stat-label mt-1" style="font-size: 0.65rem;">Top Matches</div>
                                    </div>
                                    <div class="stat-value" style="color: var(--accent-gold);">${b.matches || 0}</div>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        document.getElementById('brand-summary-cards').innerHTML = '<div class="col-12"><span class="text-muted small fw-bold">No brand data yet</span></div>';
                    }
                }

                // Fetch tally
                const tallyRes = await fetch('/api/v1/admin/dashboard/tally');
                if (tallyRes.ok) {
                    const tallyData = await tallyRes.json();
                    document.getElementById('tally-body').innerHTML = tallyData.data.map(t => `
                        <tr>
                            <td class="fw-bold">${t.job_title}</td>
                            <td style="color: var(--accent-gold);">${t.counts.PASSED || 0}</td>
                            <td style="color: var(--accent-black);">${t.counts.FAILED || 0}</td>
                            <td style="color: var(--text-muted);">${t.counts.POOLING || 0}</td>
                            <td style="color: var(--accent-black);">${t.counts.ENDORSED || 0}</td>
                            <td style="color: var(--accent-gold);">${t.counts.HIRED || 0}</td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error("Failed to load dashboard data:", err);
            }
        }

        fetchDashboardData();
        setInterval(fetchDashboardData, 10000);

        document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.form-element-btn').forEach(btn => {
            btn.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', btn.textContent.trim());
            });
        });

        const formContentsPanel = document.getElementById('form-contents-panel');
        formContentsPanel.addEventListener('dragover', (e) => e.preventDefault());
        formContentsPanel.addEventListener('drop', (e) => {
            e.preventDefault();
            const label = e.dataTransfer.getData('text/plain');
            if (!label) return;
            document.getElementById('form-contents-placeholder').classList.add('d-none');
            const list = document.getElementById('form-contents-list');
            list.classList.remove('d-none');
            const item = document.createElement('div');
            item.className = 'border rounded p-3 mb-2';
            item.innerHTML = `<span class="text-muted small fw-bold">${label}</span>`;
            list.appendChild(item);
        });

        document.getElementById('form-save-btn').addEventListener('click', async () => {
            const nameInput = document.getElementById('form-name-input');
            const name = nameInput.value.trim();
            const errorEl = document.getElementById('form-save-error');
            errorEl.classList.add('d-none');
            if (!name) {
                errorEl.textContent = 'Form name is required.';
                errorEl.classList.remove('d-none');
                return;
            }
            try {
                const res = await fetch('/api/v1/admin/forms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                if (res.status === 201) {
                    const data = await res.json();
                    bootstrap.Modal.getInstance(document.getElementById('formBuilderModal')).hide();
                    document.getElementById('form-created-toast-body').textContent = `Form "${data.name}" is created successfully!`;
                    new bootstrap.Toast(document.getElementById('form-created-toast')).show();
                    fetchDashboardData();
                } else if (res.status === 409) {
                    errorEl.textContent = 'A form with that name already exists.';
                    errorEl.classList.remove('d-none');
                } else {
                    errorEl.textContent = 'Could not save the form. Please try again.';
                    errorEl.classList.remove('d-none');
                }
            } catch (err) {
                errorEl.textContent = 'Could not reach the server.';
                errorEl.classList.remove('d-none');
            }
        });

        document.getElementById('formBuilderModal').addEventListener('hidden.bs.modal', () => {
            document.getElementById('form-name-input').value = '';
            document.getElementById('form-contents-list').innerHTML = '';
            document.getElementById('form-contents-list').classList.add('d-none');
            document.getElementById('form-contents-placeholder').classList.remove('d-none');
            document.getElementById('form-save-error').classList.add('d-none');
        });
        });
    </script>

    <!-- Form Builder Modal (shell only -- not yet wired to the API) -->
    <div class="modal fade" id="formBuilderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content" style="border-radius: 12px; overflow: hidden;">
                <div class="modal-header">
                    <input type="text" id="form-name-input" class="form-control form-control-lg border-0 fw-bold" style="font-size: 1.25rem; box-shadow: none; max-width: 320px;" placeholder="Untitled Form">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="row g-0" style="min-height: 480px;">
                        <div class="col-3 border-end p-3">
                            <div class="fw-bold mb-3">Elements</div>
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-outline-secondary text-start form-element-btn" draggable="true">Yes / No Question</button>
                                <button type="button" class="btn btn-outline-secondary text-start form-element-btn" draggable="true">Open ended</button>
                                <button type="button" class="btn btn-outline-secondary text-start form-element-btn" draggable="true">Multiple Choice</button>
                            </div>
                        </div>
                        <div class="col-9 p-4" id="form-contents-panel">
                            <div class="text-center text-muted fw-bold" style="margin-top: 180px;" id="form-contents-placeholder">
                                FORM CONTENTS
                            </div>
                            <div id="form-contents-list" class="d-none"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <span class="text-danger small me-auto d-none" id="form-save-error"></span>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-dark" id="form-save-btn">Save</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Form Created Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
        <div id="form-created-toast" class="toast align-items-center text-white bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="form-created-toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
</body>
</html>
